[tool.ruff]
# Line length compatible with existing codebase
line-length = 120
# Target Python 3.12+ (broad compatibility)
target-version = "py312"
# Exclude vendored/generated code
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
# Standard rule set — practical, not exhaustive
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax)
]
# Ignore rules that conflict with formatter or are too noisy
ignore = [
    "E501",  # line too long — handled by formatter
    "E711",  # comparison to None — sometimes intentional with SQLAlchemy
    "E741",  # ambiguous variable name — common in list comprehensions (l for line)
    "UP007", # Use X | Y for union — not all deps support it yet
    "UP042", # prefer StrEnum — keep str+Enum for broader compatibility
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # load_dotenv must run before imports
"tests/*" = ["E402", "F841"]  # test files often have late imports and unused assignments

[tool.ruff.lint.isort]
known-first-party = ["backend", "models", "services", "routers"]

[tool.ruff.format]
# Use double quotes (Python convention)
quote-style = "double"
# Unix line endings
line-ending = "lf"

[tool.mypy]
# Gradual typing — don't require annotations everywhere
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Start permissive, tighten over time
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "."
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
