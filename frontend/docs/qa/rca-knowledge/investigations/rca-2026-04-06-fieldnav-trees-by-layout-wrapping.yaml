id: rca-2026-04-06-fieldnav-trees-by-layout-wrapping
date: "2026-04-06"
layer: STANDARD
escalated_from: FAST
investigator: "@qa (RCA v9.0 — background yolo mode)"

symptoms:
  - "Bug 1: Botão 'Vincular →' em campos unmapped (grupo 'Sem binding') não faz nada ao clicar"
  - "Bug 3: Clicar em campo mapeado (grupo 'Mapeados') não abre nada no Inspector"
  - "Bug 2: Seção 'XSD obrigatórios sem match' renderiza mas itens ficam vazios (sem nome de campo)"
  - "Bugs continuaram após fix anterior (commit 4605c83) — usuário confirma que não resolveu"

prior_fix_analysis:
  commit: "4605c83"
  what_it_did:
    - "walkForBlockId: passou a usar node.id como chave primária (correto)"
    - "loadPipelineFields: pré-popula nodeId = block_id do raw pipeline data (correto)"
  why_it_did_not_work: >
    Ambas as correções operam sobre flatNodes e fieldNavItems. Mas flatNodes estava
    SEMPRE vazio porque templateStore.loadTree() falha silenciosamente quando
    trees_by_layout[activeId] é um bare TreeNode (não DocumentTree). O fix anterior
    nunca chegou a ser exercitado na prática — a raiz era anterior na cadeia causal.

root_causes:

  - id: RC1
    pattern: wrong_tree_structure_contract
    severity: critical
    location: "frontend/src/stores/session.ts — templateStore loader (linha ~201)"
    evidence_level: E1_confirmed
    description: >
      trees_by_layout[layoutId] retornado pelo backend é um bare TreeNode (objeto com
      id, type, children, etc.) — NÃO um DocumentTree wrapper ({root: TreeNode}).
      O loader chamava templateStore.loadTree(trees_by_layout[activeId] as DocumentTree).
      loadTree() verifica 'if (!tree?.root) return' — com bare node, tree.root=undefined,
      retorna silenciosamente. flatNodes fica vazio para toda a sessão.
    consequence: >
      getNodeById() sempre retorna undefined. reconcileFieldBindings() não encontra
      nenhum nó. onSelectField() nunca abre o Inspector. Bugs 1 e 3.

  - id: RC2
    pattern: type_contract_mismatch_backend_frontend
    severity: high
    location: "frontend/src/stores/session.ts — mappingStore loader (linha ~226)"
    evidence_level: E1_confirmed
    description: >
      backend envia validation_result.unmapped_xsd_fields como string[] (lista de
      XSD path strings). Frontend UnmappedXsdField interface espera objetos com
      {xsd_path: string, required: boolean, reason?: string}.
      XsdOnlyField.vue renderiza field.xsd_path — em uma string, isso é undefined.
    consequence: >
      Campos XSD sem match renderizam com nome undefined/vazio. Bug 2.

causal_chain:
  - "backend stage5._step_5_6_pipeline_result(): trees_by_layout[id] = _convert_tree_to_css_coords(tree, lt) — retorna bare dict, não wrapper"
  - "session.loadFromPipelineResult(): layoutStore loader roda PRIMEIRO → seta activeLayoutId"
  - "session.loadFromPipelineResult(): templateStore loader lê activeLayoutId != null → entra branch trees_by_layout"
  - "trees_by_layout[activeId] é bare node → cast as DocumentTree → tree.root=undefined"
  - "templateStore.loadTree(): if (!tree?.root) return → sai SEM throw, SEM log → flatNodes=[map vazio]"
  - "reconcileFieldBindings(): percorre fieldMappings, blockIdToNode.get() sempre undefined → nenhum navItem.nodeId setado"
  - "onSelectField(field): getNodeById(field.nodeId) → undefined → sem chamada a inspectorStore → Inspector não abre"
  - "(Bug 2 paralelo): unmapped_xsd_fields string[] → setUnmappedXsdFields([strings]) → XsdOnlyField.xsd_path=undefined"

why_tests_passed:
  description: >
    O mockPipelineResult nos testes NÃO inclui trees_by_layout. O branch condicional:
      if (result.trees_by_layout && activeId && result.trees_by_layout[activeId])
    é falso → cai no else-if (document_structure) que é DocumentTree válido.
    Os testes nunca exercitaram o branch de produção real.
  lesson: "tests que cobrem o else-if mas não o if principal criam coverage gap que mascara bugs de produção"

fix_applied:
  - file: "frontend/src/stores/session.ts"
    change_type: "normalization guard"
    description: >
      Antes de chamar loadTree(), detectar se rawEntry é bare node ou wrapper.
      Se !rawEntry.root → embrulhar como {root: rawEntry}. Se já tem .root → usar diretamente.
    code: |
      const rawEntry = result.trees_by_layout[activeId] as unknown
      const docTree: DocumentTree = (rawEntry && typeof rawEntry === 'object' && 'root' in (rawEntry as object))
        ? rawEntry as DocumentTree
        : { root: rawEntry as TreeNode }
      templateStore.loadTree(docTree)

  - file: "frontend/src/stores/session.ts"
    change_type: "type normalization"
    description: >
      Normalizar unmapped_xsd_fields: se item é string, converter para {xsd_path: item, required: false}.
    code: |
      const rawXsdFields = result.validation_result.unmapped_xsd_fields as unknown[]
      const normalized = rawXsdFields.map((f) =>
        typeof f === 'string' ? { xsd_path: f, required: false } : f as UnmappedXsdField
      )
      mappingStore.setUnmappedXsdFields(normalized)

  - file: "frontend/src/stores/__tests__/sessionStore.spec.ts"
    change_type: "regression tests (3 new)"
    tests_added:
      - "trees_by_layout bare-node → flatNodes populated"
      - "trees_by_layout pre-wrapped {root:node} → flatNodes populated"
      - "string[] unmapped_xsd_fields → normalized to UnmappedXsdField objects"

origin_gate:
  origin_point: "PASS — fixed in session.ts where data is loaded, not downstream"
  symptom_point: "PASS — symptom correctly identified as Inspector not opening"
  test_at_origin: "PASS — 3 new tests cover both normalization paths"
  is_band_aid: "PASS — not a guard/workaround, normalizes the contract mismatch at source"
  recurrence_guard: "PASS — tests will catch future regression if backend changes trees_by_layout format"
  score: "5/5"

results:
  tests_before: 1478
  tests_after: 1481
  test_files: 115
  all_passing: true

sops_generated:
  - id: sop-trees-by-layout-bare-node-normalization
    rule: >
      Qualquer loader que consome trees_by_layout DEVE normalizar a entrada antes
      de chamar loadTree(). Pattern: if (!rawEntry.root) wrap as {root: rawEntry}.
      Nunca assumir que trees_by_layout values são DocumentTree — são bare TreeNodes.

tags: [silent_failure, data_contract, wrong_wrapping, test_coverage_gap, fieldnavigator]
