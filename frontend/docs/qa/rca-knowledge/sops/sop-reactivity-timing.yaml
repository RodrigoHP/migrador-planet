sop:
  id: "sop-reactivity-timing"
  title: "Vue 3 Reactivity Timing — Watch Order & Deep Watch Side Effects"
  tag: "reactivity_timing"
  times_applied: 0
  effectiveness_rate: null
  generated_from:
    - "rca-2026-04-05-structure-tree-blue-bg"
    - "rca-2026-04-06-code-tab-html-overwrite"

  detection:
    description: "Bugs onde state aparece correto momentaneamente mas é sobrescrito por watch que dispara tardiamente"
    search_pattern: "watch.*deep.*true|watch.*documentTree|watch.*templateDraft"
    symptoms:
      - "Valor exibido para o usuário difere do valor esperado após carga de dados"
      - "Estado parece correto no store mas Monaco/componente exibe valor antigo"
      - "Recorrência após fix que adiciona watch: fix funciona isolado mas não em contexto real"

  fix_steps:
    1: "Identificar TODOS os watchers que modificam o mesmo valor de state"
    2: "Mapear a ordem de REGISTRO dos watchers (registration order = flush order em Vue 3)"
    3: "Identificar se alguma ação pós-inicialização (reconcile, patch, applyFlags) muta reactive state rastreado por watchers deep"
    4: "Adicionar guarda de prioridade: SE estado de maior prioridade (ex: templateDraft.html do backend) estiver definido, retornar sem sobrescrever"
    5: "Testar o cenário completo: (1) set high-priority state, (2) mutate secondary reactive source, (3) verify high-priority state preserved"

  principles:
    - "Em Vue 3, watchers registrados primeiro são executados primeiro no flush — mas podem ser re-disparados (deep) depois que watchers posteriores já executaram"
    - "watches com {deep: true} podem disparar múltiplas vezes no mesmo ciclo se a fonte for mutada por ações pós-sync"
    - "Backend data > client-generated data: sempre adicionar guarda quando há duas fontes para o mesmo state"
    - "reconcile/patch/applyFlags são 'silent mutators' — mutam reactive state sem chamar actions explícitas"

  related_rcas:
    - "rca-2026-04-05-structure-tree-blue-bg"
    - "rca-2026-04-06-code-tab-html-overwrite"
