investigation:
  id: "rca-2026-04-06-code-tab-html-overwrite"
  layer: STANDARD
  escalated_from: FAST
  date: "2026-04-06"
  bug_report: "Aba Código ainda não mostra o HTML gerado pelo backend corretamente — recorrência após 2 fixes anteriores"

  backward_trace:
    corruption_point: "frontend/src/stores/codeStore.ts:197 — watch(templateStore.documentTree, {deep:true})"
    expected_vs_actual: >
      fileContents.html deveria conter o HTML real do backend (templateDraft.html) após loadFromPipelineResult.
      Mas contém o scaffold simplificado gerado por generateHtmlFromStore() porque o watch deep de documentTree
      dispara APÓS o watch de templateDraft.html (ambos queueados no mesmo microtask flush do Vue),
      pois reconcileFieldBindings() muta nós da árvore depois que loadTemplateDraft() é chamado.
    trace_hops:
      1: "MonacoTabsInner.vue:97 — Monaco inicializa com codeStore.fileContents.html"
      2: "codeStore.ts:100 — fileContents.html inicializa como DEFAULT_HTML"
      3: "codeStore.ts:211 — watch(templateDraft?.html) seta fileContents.html = backendHtml (CORRETO)"
      4: "codeStore.ts:197 — watch(documentTree, deep) seta fileContents.html = generateHtmlFromStore() (SOBRESCREVE)"
      5: "session.ts:252 — reconcileFieldBindings() muta node.properties → ativa watch deep de documentTree APÓS templateDraft watch"

  git_forensics:
    relevant_commits:
      - "78a437e — fix(codeStore): sincronizar templateDraft.html do backend na aba Código (o fix anterior — adicionou watch templateDraft.html)"
      - "d2cdea8 — fix(codeGen): corrigir undefined nos comentários HTML gerados"
    root_file_history: "5 commits recentes em codeStore.ts e session.ts"

  origin_gate:
    origin_point: "frontend/src/stores/codeStore.ts:197 — watch(templateStore.documentTree, {deep:true}) sem guarda de templateDraft.html"
    symptom_point: "frontend/src/organisms/MonacoTabsInner.vue:97 — Monaco monta com scaffold cliente em vez do HTML real do backend"
    test_at_origin: "codeStore.spec.ts — 'documentTree watch não sobrescreve fileContents.html quando templateDraft.html está definido'"
    is_band_aid: false
    recurrence_guard: "Teste verifica que loadTemplateDraft + mutação de documentTree preserva o HTML do backend"
    score: 5
    decision: PASS

  fix_requirements:
    root_cause: "watch(documentTree, deep) sobrescreve fileContents.html com scaffold cliente quando reconcileFieldBindings() dispara o watch após loadTemplateDraft ter setado o HTML do backend"
    fix_approach: "Adicionar guarda no watch de documentTree: retornar imediatamente se generationStore.templateDraft?.html estiver definido"
    affected_files:
      - "frontend/src/stores/codeStore.ts"
    tests_required:
      - "Teste que carrega templateDraft com HTML do backend, muta documentTree, e verifica que fileContents.html ainda é o HTML do backend"
      - "Teste que sem templateDraft, watch de documentTree ainda atualiza fileContents.html normalmente"

  fix_result:
    status: FIXED
    fix_applied: >
      codeStore.ts linha 197: adicionado 'if (generationStore.templateDraft?.html) return' no início do callback
      do watch de documentTree. Isso evita que mutações tardias da árvore (de reconcileFieldBindings e similares)
      sobrescrevam o HTML do backend que foi setado pelo watch de templateDraft.html.
    files_changed:
      - "frontend/src/stores/codeStore.ts"
      - "frontend/src/stores/codeStore.spec.ts"
    tests_added:
      - "codeStore.spec.ts — 'documentTree watch não sobrescreve fileContents.html quando templateDraft.html está definido'"
      - "codeStore.spec.ts — 'documentTree watch PODE atualizar fileContents.html quando não há templateDraft definido'"
    tests_passing: true
    total_tests: 1478

  pipeline_metrics:
    version: "v9.0"
    layer: STANDARD
    escalation_path: [FAST, STANDARD]
    duration_estimate: "~10min"
    subagents_used: 0
    origin_gate:
      score: 5
      decision: PASS
