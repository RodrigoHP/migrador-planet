investigations:

  - id: "rca-2026-04-06-fieldnav-trees-by-layout-wrapping"
    date: "2026-04-06"
    layer: STANDARD
    escalated_from: FAST
    symptoms:
      - "Bug 1: Botão 'Vincular →' em campos unmapped não abre o Inspector"
      - "Bug 3: Clicar em campo mapeado não abre nada no Inspector"
      - "Bug 2: Seção 'XSD obrigatórios sem match' renderiza vazia (campos sem nome)"
      - "Bugs continuaram APÓS fix anterior (commit 4605c83) que corrigiu walkForBlockId e loadPipelineFields nodeId"
    domain: "complicated"
    severity: "critical"
    scope: "multi-file"
    root_causes:
      - pattern: "wrong_tree_structure_contract"
        location: "frontend/src/stores/session.ts:201 — templateStore loader"
        evidence_level: E1_confirmed
        detail: "trees_by_layout[id] é bare TreeNode (não DocumentTree wrapper). templateStore.loadTree() espera {root: TreeNode}. tree.root=undefined → loadTree retorna sem fazer nada → flatNodes vazio para sempre"
      - pattern: "type_contract_mismatch_backend_frontend"
        location: "frontend/src/stores/session.ts:226 — mappingStore loader"
        evidence_level: E1_confirmed
        detail: "backend unmapped_xsd_fields é string[] (XSD paths). frontend UnmappedXsdField espera {xsd_path, required, reason}. XsdOnlyField.xsd_path = undefined → campos XSD não renderizam"
    contributing_factors:
      - "Fix anterior (4605c83) corrigiu walkForBlockId e pre-população de nodeId, mas o problema era anterior: flatNodes estava vazio"
      - "loadTree silenciosamente retorna quando tree.root=undefined — sem throw, sem log — o bug passa invisível"
      - "tests usavam mockPipelineResult sem trees_by_layout, então o branch problemático nunca era executado nos testes"
      - "Reconcileação em reconcileFieldBindings também falha silenciosamente quando flatNodes vazio"
    causal_chain:
      - "backend stage5 retorna trees_by_layout[layoutId] = raw TreeNode dict (não wrappado)"
      - "layoutStore.loadLayoutTypes() é chamado ANTES de templateStore loader — activeLayoutId fica setado"
      - "templateStore loader lê activeLayoutId != null → entra no branch trees_by_layout"
      - "result.trees_by_layout[activeId] é bare node → cast as DocumentTree → tree.root=undefined"
      - "templateStore.loadTree() verifica if (!tree?.root) return → sai sem fazer nada"
      - "flatNodes = Map{} vazio para toda a sessão"
      - "reconcileFieldBindings percorre fieldMappings mas blockIdToNode.get() sempre retorna undefined"
      - "onSelectField() → getNodeById(nodeId) → undefined → sem goto Inspector → bugs 1 e 3"
      - "unmapped_xsd_fields string[] → XsdOnlyField.xsd_path=undefined → bugs 2"
    fix_applied:
      - file: "frontend/src/stores/session.ts"
        change: "Normalizar trees_by_layout entry: se não tem .root, embrulhar como {root: rawEntry}"
      - file: "frontend/src/stores/session.ts"
        change: "Normalizar unmapped_xsd_fields strings para UnmappedXsdField objects {xsd_path, required: false}"
      - file: "frontend/src/stores/__tests__/sessionStore.spec.ts"
        change: "3 novos testes: bare-node wrapping, pre-wrapped handling, string[] normalization"
    origin_gate_score: "5/5"
    tests_after_fix: "1481 passing (115 test files)"
    sops_generated:
      - "sop-trees-by-layout-bare-node-normalization"
    tags:
      - silent_failure
      - data_contract
      - wrong_wrapping
      - test_coverage_gap

  - id: "rca-2026-04-06-code-tab-html-overwrite"
    date: "2026-04-06"
    layer: STANDARD
    escalated_from: FAST
    symptoms:
      - "Aba Código não mostra o HTML gerado pelo backend — exibe scaffold simplificado do cliente"
      - "Recorrência após dois fixes anteriores (node.name fallback + watch templateDraft.html)"
    domain: "complicated"
    severity: "high"
    scope: "multi-file"
    root_causes:
      - pattern: "deep_watch_overwrite_after_reconcile"
        location: "frontend/src/stores/codeStore.ts:197 — watch(templateStore.documentTree, deep:true) sem guarda de templateDraft.html"
        evidence_level: E1_confirmed
    contributing_factors:
      - "reconcileFieldBindings() em session.ts muta nós da árvore (node.properties) APÓS loadTemplateDraft()"
      - "Mutação de propriedades de nós dispara o watch deep de documentTree"
      - "Watch deep de documentTree (reg. linha 197) tem prioridade de ordem sobre templateDraft watch (reg. linha 211)"
      - "generateHtmlFromStore() produz scaffold simplificado, não o HTML real do backend"
      - "O watch de templateDraft.html (fix anterior) funciona, mas é sobrescrito pelo watch deep posterior"
    causal_chain:
      - "session.loadFromPipelineResult() chama templateStore.loadTree() → documentTree muda"
      - "session.loadFromPipelineResult() chama generationStore.loadTemplateDraft() → templateDraft.html setado"
      - "session.loadFromPipelineResult() chama reconcileFieldBindings() → muta node.properties no documentTree"
      - "Vue flush: documentTree watch (profundo, reg. primeiro) → fileContents.html = scaffold cliente"
      - "Vue flush: templateDraft.html watch (reg. segundo) → fileContents.html = HTML backend"
      - "Vue flush: documentTree deep watch NOVAMENTE (por reconcileFieldBindings) → fileContents.html = scaffold cliente (SOBRESCREVE)"
      - "Monaco inicializa/atualiza com scaffold cliente em vez do HTML do backend"
    fix_approach: "Adicionar guarda no watch de documentTree: se generationStore.templateDraft?.html estiver definido, retornar sem atualizar — HTML do backend tem prioridade"
    files_affected:
      - "frontend/src/stores/codeStore.ts"
      - "frontend/src/stores/session.ts"
    tags:
      - "reactivity_timing"
      - "deep_watch_ordering"
      - "watch_overwrite"
      - "reconcile_side_effect"
    effectiveness: ineffective
    effectiveness_reviewed_at: "2026-04-06"
    effectiveness_note: "Fix correto para o cenário documentTree-overwrite, mas não cobre o caso raiz: codeStore instanciado APÓS pipeline completar"
    sop_generated: null
    confidence_score: 0.95
    dedup_status: new
    related_rcas:
      - "rca-2026-04-05-structure-tree-blue-bg"
    origin_gate:
      score: 5
      decision: PASS
      is_band_aid: false

  - id: "rca-2026-04-06-code-tab-html-lazy-store-init"
    date: "2026-04-06"
    layer: STANDARD
    escalated_from: STANDARD
    escalated_reason: "4ª recorrência — fixes anteriores corrigiram sintomas secundários, não a causa raiz"
    dedup_status: related
    related_rcas:
      - "rca-2026-04-06-code-tab-html-overwrite"
    symptoms:
      - "Aba Código não mostra o HTML gerado pelo backend — problema persiste após 3 fixes anteriores"
      - "4ª recorrência — fix da guarda no documentTree watch foi insuficiente"
    domain: "complicated"
    severity: "high"
    scope: "multi-file"
    root_causes:
      - pattern: "lazy_store_init_misses_preexisting_reactive_state"
        location: "frontend/src/stores/codeStore.ts:100-105 — inicialização de fileContents com DEFAULT_HTML fixo"
        evidence_level: E1_confirmed
        detail: >
          Pinia stores de setup (defineStore setup fn) são singletons criados apenas na primeira chamada de useCodeStore().
          codeStore registra watch(() => generationStore.templateDraft?.html, ...) SEM immediate:true.
          Se o pipeline completa ANTES do primeiro useCodeStore() (usuário nunca abriu a Aba Código),
          templateDraft.html já está definido, mas o watch NUNCA dispara para esse valor pré-existente.
          Monaco monta e lê fileContents.html = DEFAULT_HTML em vez do HTML do backend.
    contributing_factors:
      - "CenterPanel.vue usa v-else-if para MonacoTabs — MonacoTabs é unmounted quando não está ativo"
      - "useCodeStore() é chamado pela primeira vez dentro de MonacoTabsInner.vue e FileExplorer.vue (ambos condicionais)"
      - "Pipeline completa tipicamente enquanto usuário está na aba Canvas (não Código) — store ainda não existe"
      - "Watch sem immediate:true — comportamento padrão Vue3: dispara apenas em mudanças após registro"
      - "Fixes anteriores corrigiram race conditions do Vue flush, mas não o cenário de 'store criado tarde'"
    causal_chain:
      - "1. Pipeline completa → session.loadFromPipelineResult() executa"
      - "2. generationStore.loadTemplateDraft() → templateDraft.html = backendHtml (síncrono)"
      - "3. useCodeStore() AINDA NÃO foi chamado — store não existe"
      - "4. Vue flush: nenhum watcher do codeStore existe para capturar templateDraft.html"
      - "5. Usuário clica Aba Código → MonacoTabsInner monta → useCodeStore() chamado pela primeira vez"
      - "6. codeStore criado: fileContents.html = DEFAULT_HTML (inicialização hardcoded)"
      - "7. watch(() => templateDraft?.html) registrado — templateDraft.html não mudou desde step 2 → não dispara"
      - "8. Monaco monta com codeStore.fileContents.html = DEFAULT_HTML ← BUG"
    fix_applied:
      - file: "frontend/src/stores/codeStore.ts"
        change: >
          Inicializar fileContents com generationStore.templateDraft?.html || DEFAULT_HTML
          e generationStore.templateDraft?.css || DEFAULT_CSS em vez de valores hardcoded.
          Isso faz com que o store leia o estado atual do generationStore no momento de criação,
          cobrindo o cenário onde o pipeline já completou antes de useCodeStore() ser chamado.
      - file: "frontend/src/stores/codeStore.spec.ts"
        change: >
          Adicionado describe 'inicialização com templateDraft já carregado (RCA-2026-04-06 4ª recorrência)'
          com 2 testes: (1) instancia genStore, carrega templateDraft, depois instancia codeStore —
          verifica que fileContents.html já reflete o HTML do backend sem precisar de watch;
          (2) sem templateDraft, verifica inicialização com DEFAULT_HTML.
    origin_gate:
      origin_point: "frontend/src/stores/codeStore.ts:100-105 — fileContents inicializado com DEFAULT_HTML hardcoded"
      symptom_point: "frontend/src/organisms/MonacoTabsInner.vue:97 — Monaco monta com DEFAULT_HTML em vez do HTML do backend"
      test_at_origin: "codeStore.spec.ts — 'fileContents.html inicializa com HTML do backend quando codeStore é instanciado APÓS pipeline completar'"
      is_band_aid: false
      recurrence_guard: "Teste cobre o cenário E2E: pipeline completa → store criado tarde → Monaco vê HTML correto"
      score: 5
      decision: PASS
    tests_after_fix: "1483 passing (115 test files)"
    tags:
      - "lazy_store_init"
      - "pinia_singleton_timing"
      - "watch_not_immediate"
      - "reactivity_timing"
      - "conditional_mount"

  - id: "rca-2026-04-06-code-tab-html-conflict-banner-false-positive"
    date: "2026-04-06"
    layer: STANDARD
    escalated_from: STANDARD
    escalated_reason: "5ª iteração — fix da inicialização lazy estava correto mas externalChangeDetected ainda era setado na carga inicial, bloqueando Monaco e confundindo usuário"
    dedup_status: related
    related_rcas:
      - "rca-2026-04-06-code-tab-html-lazy-store-init"
      - "rca-2026-04-06-code-tab-html-overwrite"
    symptoms:
      - "externalChangeDetected=true na carga inicial do backend → banner 'Alteração externa detectada' aparece desnecessariamente"
      - "Banner de conflito bloqueia applyMonacoEdit, edições do usuário são bufferizadas em vez de aplicadas"
      - "Monaco pode mostrar DEFAULT_HTML se store instanciou antes da pipeline E Monaco montou antes do watch disparar"
    domain: "complicated"
    severity: "high"
    scope: "multi-file"
    root_causes:
      - pattern: "false_positive_conflict_signal_on_initial_load"
        location: "frontend/src/stores/codeStore.ts — watch templateDraft?.html sempre setava externalChangeDetected=true"
        evidence_level: E1_confirmed
        detail: >
          O watch de templateDraft?.html setava externalChangeDetected=true SEMPRE que o HTML mudava,
          incluindo na carga inicial do backend (pipeline → loadTemplateDraft). Isso não é um conflito
          real — não há edição do usuário em jogo, apenas a chegada do HTML gerado. O banner falso positivo
          causava confusão e bloqueava edições. Adicionalmente, o Monaco montava com o valor do `createModel`
          mas watch Vue poderia ter disparado com model=null durante o await import(), perdendo updates.
      - pattern: "post_mount_sync_gap"
        location: "frontend/src/organisms/MonacoTabsInner.vue:90-112 — onMounted async sem verificação pós-criação"
        evidence_level: E2_probable
        detail: >
          O `await import('monaco-editor')` no onMounted cria uma janela onde watches Vue podem disparar
          e ser ignorados (model=null guard). Após o await, createModel lê o valor atual do store
          (geralmente correto), mas em cenários de race condition com múltiplas mutações simultâneas
          pode haver discrepância entre o valor lido no createModel e o estado final do store.
    fix_applied:
      - file: "frontend/src/stores/codeStore.ts"
        change: >
          Adicionado flag templateDraftInitialLoadDone para distinguir carga inicial de mudanças posteriores.
          Na carga inicial (first loadTemplateDraft), externalChangeDetected NÃO é setado — sem banner falso positivo.
          Em cargas subsequentes (layout switch, repipeline), externalChangeDetected é setado normalmente.
          Flag inicializado como `generationStore.templateDraft != null` para cobrir o caso de store criado
          após pipeline completar (templateDraft já carregado — sem watch necessário, sem conflito).
      - file: "frontend/src/organisms/MonacoTabsInner.vue"
        change: >
          Adicionado post-mount sync check: após createModel, verifica se model.getValue() === store value.
          Salvaguarda para race conditions onde múltiplas mutações do store ocorrem durante o await import().
      - file: "frontend/src/stores/codeStore.spec.ts"
        change: >
          Atualizado teste 'templateDraft.html sync' para refletir o novo comportamento (primeira carga NÃO sinaliza conflito).
          Adicionado teste 'externalChangeDetected é setado quando templateDraft.html muda APÓS carga inicial'.
          Adicionado describe 'Monaco watch integration' com 2 testes de integração completos.
    origin_gate:
      origin_point: "frontend/src/stores/codeStore.ts — watch templateDraft?.html sem distinção de carga inicial vs mudança posterior"
      symptom_point: >
        (1) Banner falso positivo bloqueando Monaco após pipeline completar.
        (2) Monaco exibindo DEFAULT_HTML em cenários de race condition durante await import().
      test_at_origin: >
        codeStore.spec.ts — 'fileContents.html é atualizado quando templateDraft.html muda (primeira carga NÃO sinaliza conflito)'
        codeStore.spec.ts — 'Monaco watch integration: store atualiza DEPOIS que Monaco monta'
      is_band_aid: false
      recurrence_guard: >
        Testes cobrem: (1) primeira carga sem externalChangeDetected; (2) segunda carga com externalChangeDetected;
        (3) watchEffect Vue detecta mudança de DEFAULT → html_real; (4) múltiplas mutações preservam prioridade.
      score: 5
      decision: PASS
    tests_after_fix: "1486 passing (115 test files)"
    tags:
      - "false_positive_conflict"
      - "initial_load_banner"
      - "reactivity_timing"
      - "async_mount_race"
      - "pinia_watch_lifecycle"

  - id: "rca-2026-04-05-structure-tree-blue-bg"
    date: "2026-04-05"
    layer: STANDARD
    symptoms:
      - "Nós section na StructureTree aparecem com background azul/lavanda na inicialização"
      - "Nó document aparece destacado (selected) sem o usuário ter selecionado nada"
    domain: "complicated"
    severity: "medium"
    scope: "multi-file"
    root_causes:
      - pattern: "init_selection_leak"
        location: "frontend/src/stores/inspectorStore.ts:68 — initFromTree seta selectedNode=rootNode"
        evidence_level: E1_confirmed
    contributing_factors:
      - "StructureTree monta DEPOIS de initFromTree: watch(inspectorSelectedId) dispara com document.id"
      - "--color-blue-* nao definidas no @theme de main.css (fallback sempre usado)"
    causal_chain:
      - "session.ts chama initFromTree(rootNode) → inspectorStore.selectedNode = rootNode"
      - "StructureTree monta com inspectorSelectedId=null (watch set up)"
      - "initFromTree dispara APOS mount → inspectorSelectedId muda null→document.id"
      - "watch dispara → selectedNodeId = document.id → document row aparece blue"
