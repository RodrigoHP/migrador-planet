# ─────────────────────────────────────────────────────────────
# Quality Gates
# ─────────────────────────────────────────────────────────────

qualityGates:
  - gate: "contract_conformance"
    description: "Output matches contract 3.2 schema exactly"
    validation: "All required fields present in enriched_documents; types match spec"
    status: pending

  - gate: "representative_only"
    description: "Stage 2 processes ONLY representative pages from clusters"
    validation: "Non-representative pages are not extracted"
    status: pending

  - gate: "span_flags_not_name"
    description: "Bold/italic derived from span['flags'] bitfield, NOT font name parsing"
    validation: "is_bold uses bit4, is_italic uses bit1, is_mono uses bit3"
    status: pending

  - gate: "pymupdf_find_tables"
    description: "Table detection uses PyMuPDF find_tables(), not custom 3-evidence algorithm"
    validation: "page.find_tables() called; no KMeans/sklearn for table detection"
    status: pending

  - gate: "jenks_not_kmeans"
    description: "Grid detection uses jenkspy, not sklearn KMeans"
    validation: "jenkspy.jenks_breaks() called; sklearn not imported for grid"
    status: pending

  - gate: "performance"
    description: "~6 representative pages extracted in < 10 seconds"
    validation: "Benchmark test with real PDF fixture"
    status: pending

  - gate: "no_all_pages"
    description: "Stage 2 never iterates all pages of a PDF"
    validation: "Only clusters[].representative_page indices are processed"
    status: pending

# ─────────────────────────────────────────────────────────────
# Risks & Mitigations
# ─────────────────────────────────────────────────────────────

risks:
  - risk: "PyMuPDF find_tables() may not detect tables in PDFs without ruling lines"
    probability: low
    impact: medium
    mitigation: "Planet Express PDFs are engine-generated with vector structure; find_tables() handles ruling_lines + clustering fallback"

  - risk: "jenkspy not available on deployment environment"
    probability: low
    impact: high
    mitigation: "Add to requirements.txt; jenkspy is pure Python with no C extensions on most platforms"

  - risk: "sub_spans memory overhead for documents with many blocks"
    probability: low
    impact: low
    mitigation: "sub_spans=null for uniform blocks (majority); only populated for mixed-style blocks"

  - risk: "Backward compatibility with existing parsed_document.py consumers"
    probability: medium
    impact: medium
    mitigation: "All new fields have defaults; existing code continues to work unchanged"

