id: "rca-2026-04-06-canvas-tree-click-no-highlight"
date: "2026-04-06"
layer: FAST
domain: complicated
severity: high
scope: cross-module

symptoms:
  - "Clicar nó na aba Estrutura atualiza o Inspector mas NÃO destaca nada no canvas"
  - "elementBoxes.get(id) retorna undefined mesmo após canvas renderizar e enviar canvas-element-bbox"
  - "selectFromTree(id) chamado mas selectionBox nunca muda — overlay não aparece"

root_causes:
  - pattern: "non_singleton_composable"
    location: "frontend/src/composables/useCanvasInteraction.ts"
    evidence_level: E1_confirmed
    description: >
      Todos os refs (selectionState, dragState, resizeState, multiSelection, elementBoxes, hierarchyPopup)
      eram declarados DENTRO da função useCanvasInteraction(). Cada chamada (HTMLCanvas, setup do
      CanvasSelectionOverlay, e o handler handleIframeMessage) criava instâncias isoladas.
      elementBoxes registrado pelo handler (instância B) nunca era visível para selectFromTree
      em HTMLCanvas (instância C).

contributing_factors:
  - "Handler handleIframeMessage chamava useCanvasInteraction() inline criando instância efêmera adicional"
  - "Pinia stores (useEditorStore, useInspectorStore) são singletons — mascaravam o problema parcialmente (inspector funcionava, canvas não)"
  - "Sem teste de integração entre overlay e HTMLCanvas — falha cruzada passava despercebida"

fix_approach: >
  Mover todos os refs para escopo de módulo (fora da função). Pinia stores permanecem dentro
  da função (precisam do contexto ativo). Adicionar resetState() ao retorno para isolamento
  de testes. Corrigir CanvasSelectionOverlay para usar registerElementBox/selectElement
  do destructuring de setup, não de chamada inline no handler.

files_affected:
  - "frontend/src/composables/useCanvasInteraction.ts"
  - "frontend/src/organisms/CanvasSelectionOverlay.vue"
  - "frontend/src/composables/useCanvasInteraction.spec.ts"

origin_gate:
  origin_point: "frontend/src/composables/useCanvasInteraction.ts — refs declarados dentro da função"
  symptom_point: "frontend/src/organisms/HTMLCanvas.vue:selectFromTree — elementBoxes.get() retorna null"
  test_at_origin: "useCanvasInteraction.spec.ts — 40 testes cobrindo registro, seleção e sincronização cross-instance"
  is_band_aid: false
  recurrence_guard: "Teste 'registerElementBox e selectElement compartilham estado entre instâncias' (singleton test)"
  score: 5
  decision: PASS

tags:
  - non_singleton_composable
  - state_isolation
  - cross_component_sync
  - vue_composable

