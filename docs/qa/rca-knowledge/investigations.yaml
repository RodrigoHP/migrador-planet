    fix_approach: "Reverter _bbox_to_absolute_style para y_px = (page_height_pts - y1) * scale_y. Corrigir .footer CSS para top:0; height:1123px. Corrigir testes para usar bbox em coords PDF (bottom-left origin)."
    files_affected:
      - "backend/services/stages/stage5_template_generation.py"
      - "backend/tests/test_stage5_template_generation.py"
    tags:
      - "logic_error"
      - "data_contract"
      - "backend_stage"
