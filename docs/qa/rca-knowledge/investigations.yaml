  - id: "rca-2026-04-11-table-area-silently-ignored"
    date: "2026-04-11"
    layer: STANDARD
    escalated_from: FAST
    symptoms:
      - "Tabela do boleto renderizada como text spans soltos em vez de <table> HTML"
      - "Região classificada como table_area por GPT-4o, mas sem efeito no output"
      - "find_tables() não detecta a tabela → nenhum fallback disponível → imagem/spans"
    domain: "complicated"
    severity: "high"
    scope: "single-file"
    root_causes:
      - pattern: "silent_exclusion"
        location: "backend/services/stages/stage3_structural/section_utils.py:407"
        evidence_level: E1_confirmed
    contributing_factors:
      - "_assign_visual_elements_to_sections filtrava apenas chart_area/barcode_area/svg_area"
      - "table_area estava explicitamente excluído pelo if rtype not in (...)"
      - "find_tables() pode falhar em boletos com tabelas de fundo rasterizado"
      - "Sem fallback visual, tabela dependia 100% do find_tables() programático"
    causal_chain:
      - "GPT-4o → table_area detectado corretamente"
      - "_assign_visual_elements_to_sections → rtype not in (...) → continue (skip)"
