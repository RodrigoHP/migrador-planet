      - "custom:css_reference_frame"
    escalated_from: FAST
    causal_chain:
      - "PDF bbox em coords bottom-left → _bbox_to_absolute_style usa y0 sem inversão → CSS top = y0*scale (errado)"
      - "CSS top alto para elementos do topo (y0≈800 → top≈1067px) → invisíveis (overflow:hidden)"
      - "CSS top baixo para elementos do fundo (y0≈10 → top≈13px) → aparecem no topo do canvas"
