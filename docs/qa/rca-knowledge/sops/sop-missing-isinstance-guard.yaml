# SOP — Missing isinstance Guard Before .get()
# Auto-generated from RCA 2026-03-29 (AP-001)
# Used by Pattern Matcher Agent (Story 17.4) for fast-track resolution

sop:
  id: "sop-missing-isinstance-guard"
  name: "Fix .get() sem isinstance guard"
  created_from: "rca-2026-03-29-analyzing-page"
  anti_pattern: "AP-001"
  confidence: 0.95
  recurrence: 4  # RCA 15.18, 15.19, 15.20, 2026-03-29

  # v6.0 — Outcome Tracking (v7.0: updated retroactively)
  times_applied: 1  # rca-2026-03-31 matched AP-001 pattern
  times_effective: 0
  times_ineffective: 0
  effectiveness_rate: null  # calculated: times_effective / times_applied (pending review)
  needs_review: false
  last_applied: "2026-03-31"
  last_investigation: "rca-2026-03-31-stage5-document-trees-contract"

  symptoms:
    - "'list' object has no attribute 'get'"
    - "'NoneType' object has no attribute 'get'"
    - "AttributeError em .get() dentro de stages/parsers/transformers"

  detection:
    search_pattern: '\.get\('
    scope: "backend/services/stages/*.py"
    filter: "linhas onde o objeto pode ser list em vez de dict"

  fix_steps:
    - step: 1
      action: "Identificar o objeto que recebe .get()"
      example: "layout_types[0].get('id')"
    - step: 2
      action: "Extrair para variável intermediária"
      example: "first_layout = layout_types[0] if layout_types else None"
    - step: 3
      action: "Adicionar isinstance guard antes do .get()"
      example: "first_layout_id = first_layout.get('id') if isinstance(first_layout, dict) else None"
    - step: 4
      action: "Criar teste que reproduz o cenário com lista em vez de dict"

  template: |
    # Antes
    value = obj[0].get("key") if obj else None

    # Depois
    first = obj[0] if obj else None
    value = first.get("key") if isinstance(first, dict) else None
