top_issues:
  - id: '5.11-I1'
    severity: MEDIUM
    description: >
      Título do story diz "Bloco 7" mas Stage 25 é registrado com block_id=8 via
      register_bloco8_confidence(). Confusão de rastreabilidade — Story 5.11 implementa
      parcialmente o Bloco 8. Sem impacto no código.
    owner: '@sm'
  - id: '5.11-I2'
    severity: MEDIUM
    description: >
      Bug de escala: Stage 22 armazena consistency_score como int 0-100 (ex: 85).
      Stage 25 _get_vision_agreement() faz min(1.0, float(cs)) sem dividir por 100,
      resultando em vision_agreement=1.0 sempre que score >= 1. Fator fica incorretamente
      saturado. Correção: dividir por 100.0 ao ler consistency_score da visual_analysis.
    owner: '@dev'
  - id: '5.11-I3'
    severity: LOW
    description: >
      _find_adjacent_label usa blk["bbox"] sem .get() — KeyError se text_block não
      tiver bbox. Blocos de stages anteriores sempre devem ter bbox, mas acesso defensivo
      seria mais robusto.
    owner: '@dev'
recommendations:
  immediate:
    - >
