nfr_validation:
  security:
    status: PASS
    notes: >
      Autocomplete populado apenas de mappingStore.fieldNavItems (campos XSD
      registrados). generateFormatComputed gera código Knockout sem eval().
      Color pickers usam input[type=color] nativo — sem injeção CSS.
  performance:
    status: PASS
    notes: >
      Autocomplete dropdown com v-if — sem overhead quando fechado.
      parsedFields é computed — recalculado apenas quando o valor muda.
      Preview substitui tokens localmente sem chamada ao servidor.
  reliability:
    status: PASS
    notes: >
      Escape de braces (\{ \}) previne colisão com sintaxe Knockout.
      Campos inválidos destacados em vermelho com tooltip — feedback imediato
      sem bloquear a edição. Fallback para string vazia em campos sem dados.
  maintainability:
    status: PASS
    notes: >
      formatStringGenerator é puro (sem dependências externas) — facilmente
      testável. FormatStringEditor desacoplado do store — recebe fieldItems
      como prop. ConditionalStyleSection stateless via v-model de array.
top_issues:
  - id: CONCERN-1
    severity: low
    title: 'Autocomplete dropdown não abre em JSDOM (limitação de ambiente de teste)'
    description: >
      O teste de autocomplete dropdown falhou em contexto JSDOM porque o
      posicionamento do dropdown depende de getBoundingClientRect(), que retorna
      zeros em JSDOM. Workaround aplicado no spec via mock. Comportamento real
      no browser está correto.
    suggested_fix: >
      Teste E2E com Playwright para validar dropdown real no browser.
      TD-7.8-001.
