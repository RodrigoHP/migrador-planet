schema: 1
story: '7.8'
story_title: 'Format String — Editor de Campos com Autocomplete e Estilos Condicionais'
gate: PASS
status_reason: >
  Implementação completa: FormatStringEditor com autocomplete acionado por '{',
  navegação por teclado (↑↓ Enter Tab Escape), highlight de campos válidos (azul)
  e inválidos (vermelho + tooltip), preview em tempo real com dados sintéticos,
  suporte a escape (\{ e \}). ConditionalStyleRule com SE [campo] [op] [valor]
  ENTÃO [propriedade] = [valor], color pickers, dropdown de visibilidade.
  ConditionalStyleSection com lista de regras e botão "+ Regra".
  formatStringGenerator utilitário com parseFormatFields, generateFormatComputed
  e generateStyleBindings. ElementInspector integrado com Format String e Estilo
  Condicional. 33 testes no total (16 utils + 11 editor + 6 section).
  Build sem erros TypeScript. 409/409 testes passando.
reviewer: 'Quinn (Test Architect)'
