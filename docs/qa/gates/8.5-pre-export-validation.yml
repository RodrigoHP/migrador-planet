schema: 1
story: '8.5'
story_title: 'Validação Pré-Exportação'
gate: PASS
status_reason: >
  Implementação completa da validação pré-exportação. usePreExportValidation composable
  com 6 checks: placeholder ##TEMPLATE_DATA## no index.html (AC2, bloqueante),
  ko.applyBindings no base.js (AC3, bloqueante), integridade de data-bind attributes
  vs mappingStore.fields (AC4, bloqueante/aviso), referências a assets flagradas como
  avisos não verificados (AC5), HTML bem-formado via DOMParser (AC6, bloqueante),
  CSS parse de chaves (AC9, bloqueante), bibliotecas verificadas contra catálogo
  SYSTEM_LIBS via useBibliotecas (AC10, aviso). ExportValidationModal.vue (AC11):
  erros bloqueantes em vermelho + "Corrigir", avisos em amarelo + "Exportar mesmo assim".
  useExport.ts integrado: skipWarnings option, lastValidation ref, bloqueio por erros
  bloqueantes (AC7), warnings-only permite exportar com skipWarnings (AC8).
  TopToolbar.vue orquestra modal e re-export. 20 testes usePreExportValidation.spec.ts.
  597/597 testes passando. Build limpo.
reviewer: 'Quinn (Test Architect)'
