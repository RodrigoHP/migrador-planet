nfr_validation:
  security:
    status: PASS
    notes: >
      DOMParser usado para parse seguro de HTML (sem eval/innerHTML em contexto
      principal). CSS validado apenas por contagem de chaves — sem execução.
      Exportação bloqueada programaticamente para erros bloqueantes.
  performance:
    status: PASS
    notes: >
      Validação síncrona no frontend — sem chamadas de rede extras.
      DOMParser é nativo do browser, sem dependências adicionais.
      Debounce não necessário pois validação ocorre apenas no clique de exportar.
  reliability:
    status: PASS
    notes: >
      hasBlockingErrors determina fluxo de exportação. skipWarnings permite
      bypass controlado de avisos. lastValidation ref exposto para que TopToolbar
      possa alimentar ExportValidationModal com dados atualizados.
  maintainability:
    status: PASS
    notes: >
      Helper functions exportadas individualmente (checkTemplatePlaceholder,
      checkKoApplyBindings, checkDataBindIntegrity, etc.) permitem testes
      unitários isolados por AC. SYSTEM_LIBS catálogo centralizado.
top_issues:
  - id: CONCERN-1
    severity: medium
    title: 'AC5 — asset refs marcadas apenas como aviso não verificado'
    description: >
      Assets referenciados via src= e url() são flagrados como avisos genéricos
      "asset reference unverified" em vez de verificar existência real nos stores
      de assets/bibliotecas. A implementação completa requereria acesso ao
      assetStore ou IndexedDB.
    suggested_fix: >
      Em Epic 9, integrar com assetStore para verificar existência real de imagens
      e fontes antes de marcar como aviso. TD-8.5-001.
  - id: CONCERN-2
    severity: low
    title: 'CSS validation por contagem de chaves é simplificada'
    description: >
      AC9 implementado via contagem de abertura vs fechamento de chaves no CSS.
      Não detecta todos os erros de sintaxe CSS (ex: propriedades inválidas,
      valores malformados). Implementação completa requereria parser CSS real.
    suggested_fix: >
      Usar biblioteca css-tree ou postcss para parse completo. TD-8.5-002. Epic 9.
recommendations:
  immediate: []
  future:
    - 'TD-8.5-001: Verificação real de assets contra assetStore/IndexedDB'
    - 'TD-8.5-002: Parser CSS completo (css-tree ou postcss) para AC9'
    - 'TD-8.5-003: AC4 — expandir suporte a binding expressions complexas (computed, nested foreach)'
