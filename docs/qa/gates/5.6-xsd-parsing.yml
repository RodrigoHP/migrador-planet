top_issues:
  - id: ISSUE-1
    severity: medium
    title: 'stage_number=28 conflita com Pipeline Result existente'
    description: >
      O default_registry registra stage 28 como "Pipeline Result" no Block 8.
      xsd_parser.register() chama remove_stage(28) antes de registrar o XSD Parsing
      no Block 1. Se register_bloco1() for chamado sem register_bloco9() em seguida,
      "Pipeline Result" é perdido permanentemente da instância. A ordem de chamada
      em register_all() mascara o problema mas não o resolve.
    suggested_owner: dev
    suggested_fix: >
      Usar stage_number=29 (ou qualquer número não usado no default_registry) para
      o estágio XSD Parsing. Atualizar registro em xsd_parser.register() e
      register_bloco1() para refletir o novo número. Remover a chamada remove_stage()
      que não deveria ser necessária.
  - id: ISSUE-2
    severity: low
    title: 'Docstring find_by_path descreve "index check" mas realiza linear scan'
    description: >
      O docstring de find_by_path diz "Uses flat_paths for an early-exit index check"
      mas flat_paths é uma lista Python — membership check com `in` é O(n), não
      O(1) como sugere "index". O comportamento está correto mas a documentação
      é enganosa.
    suggested_owner: dev
    suggested_fix: >
      Alterar docstring para "Uses flat_paths for an early-exit linear membership
      check before traversal." — ou mudar flat_paths para set() internamente
      mantendo list para serialização.
recommendations:
  immediate:
    - 'Corrigir stage_number de 28 para 29 em xsd_parser.register() (ISSUE-1 — medium)'
    - 'Remover chamada remove_stage(28) que é perigosa com o registry padrão'
  future:
    - 'Considerar set interno em FieldTree para membership O(1) em schemas grandes (>1000 campos)'
    - 'Adicionar teste de integração que valida register_bloco1() não remove Pipeline Result'
    - 'Corrigir docstring find_by_path para precisão técnica (ISSUE-2 — low)'
