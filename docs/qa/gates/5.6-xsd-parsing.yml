  security:
    status: PASS
    notes: >
      Sem execução de código arbitrário. lxml fromstring usado com bytes/string
      controlados — sem XXE risk para os inputs aceitos. FileNotFoundError exposto
      ao chamador é aceitável (erro de operação, não de segurança).
  performance:
    status: PASS
    notes: >
      Parser recursivo adequado para XSD típicos de documentos business (<500 elementos).
      Nota: build_flat_paths usa list como fila com pop(0) — O(n²) para árvores
      muito grandes, mas negligenciável para o domínio alvo. find_by_path usa
      membership check em lista (O(n)) conforme documentado como "linear search".
  reliability:
    status: CONCERNS
    notes: >
      stage_number=28 conflita com "Pipeline Result" existente no default_registry.
      Chamada isolada de register_bloco1() destrói o stage 28 original sem recuperação.
      register_all() funciona corretamente (register_bloco9 sobrescreve ao final)
