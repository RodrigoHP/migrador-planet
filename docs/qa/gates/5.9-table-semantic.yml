status_reason: >
  Implementação completa: 3 estágios (17-19) implementados e registrados no StageRegistry,
  todos os 8 ACs cobertos, 20/20 testes passando (189 no suite total).
  Decisão arquitetural chave (table detection antes de anchor detection) confirmada e
  testada com test_semantic_table_header_not_label. Algoritmos de scoring combinado para
