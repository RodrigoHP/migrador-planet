schema: 1
story: '7.6'
story_title: 'Monaco Editor Tab'
gate: PASS
status_reason: >
  Implementação completa do Monaco Editor multi-arquivo com explorador de arquivos.
  codeStore (Pinia) com CODE_FILES (4 arquivos: html/css/js/exemplo), activeFile,
  setFileContent (bloqueia exemplo.js read-only), applyMonacoEdit com debounce,
  buffer de conflito bidirecional (externalChangeDetected + pendingMonacoEdit),
  resolveExternalChange (keepMonaco/keepStore), dismissExternalChange.
  FileExplorer organism (305 linhas): árvore de arquivos com grupos Template/CSS/JS/Assets,
  badge RO em exemplo.js, clique abre arquivo no editor e ativa aba Código,
  hint MVP sobre operações bloqueadas (criar/deletar/renomear). MonacoTabsInner
  atualizado: multi-arquivo via abas, readOnly para exemplo.js, indicators de
  arquivo ativo. CenterPanel aba "Código" integra FileExplorer + MonacoTabsInner.
  LeftPanel com terceira aba [Arquivos] visível apenas quando aba Código está ativa.
  15 testes codeStore + 14 testes FileExplorer. 572/572 testes passando. Build limpo.
