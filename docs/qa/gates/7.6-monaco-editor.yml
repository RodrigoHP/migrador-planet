nfr_validation:
  security:
    status: PASS
    notes: >
      exemplo.js bloqueado tanto no codeStore (setFileContent verifica readOnly)
      quanto no MonacoTabsInner (option readOnly: true). Operações de
      criar/deletar/renomear bloqueadas no MVP. Sem execução de código JavaScript
      do editor no contexto principal da aplicação.
  performance:
    status: PASS
    notes: >
      Monaco carregado de forma lazy via @monaco-editor/vue (chunk 4MB separado
      no build). debounce de 500ms antes de parse evita sobrecarga. FileExplorer
      estático (sem re-renders desnecessários).
  reliability:
    status: PASS
    notes: >
      Buffer de conflito preserva edição do Monaco quando templateStore muda
      durante debounce. resolveExternalChange dá ao usuário controle sobre
      conflito. SYSTEM fonte de verdade (templateStore) preservada.
  maintainability:
    status: PASS
    notes: >
      codeStore centraliza lógica de conflito e estado dos arquivos. FileExplorer
      stateless exceto pelo codeStore. CODE_FILES constante — extensível para
      novos arquivos.
top_issues:
