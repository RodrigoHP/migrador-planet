story: '8.6'
story_title: 'Gerenciamento de Bibliotecas (Fontes, CSS, JS)'
gate: PASS
status_reason: >
  Implementação completa do gerenciamento de bibliotecas. useBibliotecas
  composable reescrito com IndexedDB via idb, 3 categorias (fonts/css/js),
  proteção de libs sistema (SYSTEM_LIBS), filtro de extensão, limites de
  tamanho (5MB fontes / 1MB CSS+JS), utilitários formatFileSize/getExtension.
  BibliotecaFileList molecule com badge "Sistema" e botão oculto para libs
  protegidas. BibliotecasModal organism reescrito com 3 abas (Fontes/CSS/JS),
  upload com validação, dialog de confirmação para arquivos referenciados.
  26 testes do composable + 20 testes do modal. 482/482 testes passando.
  Build limpo.
reviewer: 'Quinn (Test Architect)'
