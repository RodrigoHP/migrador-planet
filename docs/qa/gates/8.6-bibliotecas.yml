nfr_validation:
  security:
    status: PASS
    notes: >
      Libs sistema (knockout, Chart.js) não removíveis — botão oculto + sem
      action de remoção. Validação de extensão antes de salvar em IDB.
      Limite de tamanho enforçado no frontend antes de persistir.
      Dialog de confirmação para remoção de arquivos referenciados.
  performance:
    status: PASS
    notes: >
      IndexedDB via idb — operações assíncronas sem bloquear UI. BibliotecaFileList
      com v-for otimizado. Modal com v-if — sem overhead quando fechado.
  reliability:
    status: PASS
    notes: >
      SYSTEM_LIBS constante garante proteção independente do estado do IDB.
      Suporte a ambas variantes de pasta (fonts/ e fontes/). Rejeição de
      arquivo com mensagem descritiva incluindo o limite específico.
  maintainability:
    status: PASS
    notes: >
      useBibliotecas composable isolado — fácil de testar e reutilizar.
      BibliotecaFileList stateless — recebe files[] como prop.
      Categorias como enum — extensível para novas categorias.
