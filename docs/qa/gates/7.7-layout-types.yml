nfr_validation:
  security:
    status: PASS
    notes: >
      setActiveLayout valida que o ID existe antes de trocar.
      Estado salvo em Pinia (in-memory) — sem localStorage direto.
  performance:
    status: PASS
    notes: >
      Troca de layout é síncrona e instantânea (Pinia reactive). Loading
      indicator de 100ms para feedback visual ao usuário.
      LayoutSelector com v-if para ocultar quando 1 layout — sem overhead.
  reliability:
    status: PASS
    notes: >
      Estado do layout ativo preservado antes da troca (AC #8).
      Reset do InspectorPanel para PageInspector na troca previne nó inválido.
      Fallback para layout único padrão quando pipeline não detecta layouts.
  maintainability:
    status: PASS
    notes: >
      layoutStore centraliza toda lógica de troca. LayoutSelector stateless
      — recebe layoutTypes e activeLayoutId como computed.
      Interface LayoutType bem tipada.
top_issues:
  - id: CONCERN-1
    severity: low
    title: 'Estado dos layouts não é persistido em IDB entre sessões'
    description: >
      Os layoutTypes e seus documentTrees ficam apenas em memória Pinia.
      Ao recarregar a página os dados do pipeline devem ser recarregados.
      Aceitável para Epic 7 (pipeline é reexecutado ao abrir projeto).
    suggested_fix: >
      Persistir layoutTypes em IDB junto com o restante do layoutStore.
      TD-7.7-001. Epic 8.
