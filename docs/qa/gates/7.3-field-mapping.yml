nfr_validation:
  security:
    status: PASS
    notes: >
      dataTransfer usa tipos 'text/plain' seguros. Binding apenas aceita
      paths de campos XSD registrados no mappingStore.
      Confirmação de substituição previne overwrites acidentais.
  performance:
    status: PASS
    notes: >
      Drag ghost element nativo do browser — sem criação de elementos extras.
      coverageStore.updateFromMappingStore() chamado apenas no drop, não
      durante drag.
  reliability:
    status: PASS
    notes: >
      dragover.prevent previne navegação do browser. drop com validação de
      nodeId antes de chamar mapField. removeBinding verifica existência do
      binding antes de limpar.
  maintainability:
    status: PASS
    notes: >
      mappingStore centraliza toda a lógica de mapeamento.
      FieldNavItem reutilizável como drag source sem acoplar ao drop target.
