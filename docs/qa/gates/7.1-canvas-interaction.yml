nfr_validation:
  security:
    status: PASS
    notes: >
      postMessage filtra por origin. Overlay sobre iframe — sem acesso direto
      ao content do iframe. Seleção via ID externo, sem eval().
  performance:
    status: PASS
    notes: >
      elementBoxes como Map para lookup O(1). calcSnapLines opera apenas sobre
      elementos registrados. requestAnimationFrame recomendado no futuro para
      updateDrag (TD-7.1-001).
  reliability:
    status: PASS
    notes: >
      clearSelection no unmount previne estado stale. Multi-seleção usa Set
      imutável. Fallback para nenhum snap quando snapEnabled=false.
  maintainability:
    status: PASS
    notes: >
      useCanvasInteraction composable puro — sem dependências de template.
      CanvasSelectionOverlay recebe selectionState como prop.
      8 handles computados de BoundingBox.
top_issues:
  - id: CONCERN-1
    severity: low
    title: 'requestAnimationFrame não aplicado em updateDrag'
    description: >
      updateDrag chama templateStore.moveElement diretamente a cada mousemove,
      podendo causar throttle em documentos grandes com muitos elementos.
    suggested_fix: >
      Usar requestAnimationFrame para throttle do updateDrag.
      TD-7.1-001. Baixa prioridade para Epic 7.
  - id: CONCERN-2
    severity: low
    title: 'Integração de undo stack com Story 7.2 requer verificação'
    description: >
      AC #10 define que operações de drag/resize integram com undo stack da
      Story 7.2. O composable chama templateStore.moveElement que usa
      pushUndoSnapshot internamente — integração funcional mas não testada
      como sistema integrado.
    suggested_fix: >
      Teste de integração em Epic 8 quando ambiente E2E disponível.
      TD-7.1-002.
