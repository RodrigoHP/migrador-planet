nfr_validation:
  security:
    status: PASS
    notes: >
      iframe com sandbox="allow-same-origin". CSS do template isolado do editor.
      Sem eval() ou scripts externos injetados. srcdoc é abordagem segura.
      box-sizing reset previne leakage de estilos globais para dentro do iframe.
  performance:
    status: PASS
    notes: >
      IntersectionObserver para lazy rendering — máximo 5 páginas visíveis simultaneamente.
      CSS transform:scale sem reflow do layout. Placeholder com altura fixa evita scroll jump.
      rootMargin: 200px para preload suave.
  reliability:
    status: PASS
    notes: >
      Empty state quando templateDraft ausente. First page pre-seeded no onMounted.
      teardownObserver em onUnmounted previne memory leak. watch em templateDraft
      re-inicializa visiblePages quando template troca.
  maintainability:
    status: PASS
    notes: >
      useCanvas composable encapsula zoom+observer com interface limpa.
      CanvasGuides molecule independente com props bem tipadas.
      ZoomControls molecule reutilizável via composable.
      HTMLCanvas focado em orquestração de composable + molecules.
      CenterPanel atualizado minimamente (1 linha de template + 1 import).
