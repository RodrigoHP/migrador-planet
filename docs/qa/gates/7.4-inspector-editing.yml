story_title: 'InspectorPanel Editing — Edição de Propriedades por Nível'
gate: PASS
status_reason: >
  Implementação completa de todos os 4 níveis editáveis. Moléculas
  InspectorInput, InspectorSelect, InspectorColorPicker, InspectorCheckbox,
  PositionControl e SizeControl criadas. PageInspector e SectionInspector
  totalmente editáveis. TableInspector com dropdown de data source e colunas
  editáveis. ChartInspector com dropdowns de tipo e data binding.
  ImageInspector com file picker e download. ElementInspector com todos inputs
  editáveis e dropdown de tipo de campo. templateStore expandido com
  updateNodeProperty, updatePageProperty e removeNode. 32 testes de actions.
  Todos os 11 ACs atendidos. Build sem erros TypeScript.
