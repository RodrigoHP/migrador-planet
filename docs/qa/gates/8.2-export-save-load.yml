schema: 1
story: '8.2'
story_title: 'Export ZIP + Save/Load de Projeto'
gate: PASS
status_reason: >
  Implementação completa do fluxo de exportação ZIP e save/load. useExport composable
  com JSZip: POST /api/generate → estrutura template/ (index.html, css/style.css,
  js/base.js, js/exemplo.js, assets/). Opção includeTestData para pasta test_data/.
  usePreExportValidation stub para integração futura com Story 8.5.
  downloadBlob + downloadJson helpers reutilizáveis. TopToolbar atualizado com botão
  "📦 Exportar" (modal de opções, botão desabilitado durante exportação) e botão
  "💾 Salvar" (downloadJson do estado do projeto). HomePage atualizada com "Abrir
  Projeto" que lê JSON do disco. session.ts com serializeProject/deserializeProject.
  9 testes useExport + testes integrados TopToolbar. 572/572 testes passando.
  Build limpo.
