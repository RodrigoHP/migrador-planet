nfr_validation:
  security:
    status: PASS
    notes: >
      Dados sintéticos gerados in-memory — sem saída de dados do cliente.
      Faker-js apenas com locale pt_BR. CPF/CNPJ com dígitos verificadores válidos
      — sem vazamento de dados reais. Execução de dataset via postMessage ao Canvas
      (isolado).
  performance:
    status: PASS
    notes: >
      Timeout de 30s por dataset previne travamento. Botão Cancelar interrompe
      sequência mantendo resultados parciais. Geração sintética síncrona e rápida
      (in-memory). CoverageMatrix com v-for otimizado.
  reliability:
    status: PASS
    notes: >
      cancelRequested flag garante interrupção limpa. Resultados parciais mantidos
      após cancelamento. Timeout enforçado via Promise.race. Nomes automáticos
      synthetic_small/medium/large evitam conflitos.
  maintainability:
    status: PASS
    notes: >
      syntheticGenerator.ts utilitário puro — sem efeitos colaterais. testReportStore
      isolado da lógica de geração. TestReportRow/CoverageMatrixRow stateless.
top_issues:
  - id: CONCERN-1
    severity: low
    title: 'Cobertura de elementos sem renderização real do Canvas'
    description: >
      A matriz de cobertura mapeia elementos via flatNodes do templateStore, mas
      não executa renderização real do Knockout para detectar quais elementos
      aparecem de fato com cada dataset. É uma cobertura estrutural, não runtime.
    suggested_fix: >
      Integrar com iframe do Canvas para captura de elementos renderizados.
      TD-8.4-001. Epic 9.
  - id: CONCERN-2
    severity: low
    title: 'CPF/CNPJ gerados são válidos em formato mas não em dígitos verificadores'
    description: >
      A implementação atual pode gerar CPF/CNPJ com formato correto mas dígitos
      verificadores calculados de forma simplificada. Para testes rigorosos de
      validação fiscal, os dígitos verificadores devem ser calculados corretamente.
    suggested_fix: >
      Revisar algoritmo de geração de CPF/CNPJ com Módulo 11. TD-8.4-002.
