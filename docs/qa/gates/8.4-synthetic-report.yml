schema: 1
story: '8.4'
story_title: 'Gerador de Dados Sintéticos + Relatório de Testes'
gate: PASS
status_reason: >
  Implementação completa do gerador sintético e relatório de testes. syntheticGenerator.ts
  com geração por tipo (string→nomes BR, decimal→número, date→data DD/MM/YYYY,
  integer, boolean) e valores BR específicos (CPF formato válido, CNPJ, phone,
  currency R$ X.XXX,XX). Tamanhos small/medium/large via parâmetro de array multiplier.
  testReportStore com actions startRun/addResult/cancel/reset. TestReportPanel organism
  com botões "Gerar Sintético" (dropdown P/M/G), "▶ Testar Todos" → "Cancelar",
  timeout de 30s por dataset, aba "Report" no EditorLayout. CoverageMatrix via
  CoverageMatrixRow molecule e TestReportRow molecule. Aba "Report" adicionada ao
  EditorLayout ao lado de "Dados de Teste". Coleta elementos do templateStore via
  flatNodes. 572/572 testes passando. Build limpo.
