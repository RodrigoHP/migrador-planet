nfr_validation:
  security:
    status: PASS
    notes: >
      File picker filtrado por extensão (.xml, .json). Parsing XML via
      biblioteca segura (sem eval). Dados de teste isolados em store — sem
      envio ao servidor. postMessage para Canvas com origem verificável.
  performance:
    status: PASS
    notes: >
      Validação XSD síncrona e rápida (in-memory). Limite de 5 datasets
      previne uso excessivo de memória. Lista datasets com v-for otimizado.
  reliability:
    status: PASS
    notes: >
      Limite de 5 datasets enforçado na action addDataset com mensagem clara.
      Revalidação automática após edição. Fallback textarea se Monaco não
      disponível. Status calculado deterministicamente (obrigatórios > aviso > ok).
  maintainability:
    status: PASS
    notes: >
      testDataStore centraliza lógica de validação e estado. DatasetItem
      stateless via props. TestDataPanel desacoplado — recebe tudo do store.
top_issues:
  - id: CONCERN-1
    severity: low
    title: 'Modal de edição usa textarea em vez de Monaco completo'
    description: >
      AC8 especifica Monaco Editor para edição inline. O agente implementou
      interface Monaco-compatível com fallback textarea — funcional mas sem
      syntax highlighting completo. Monaco completo depende de Story 7.6
      (Deferred).
    suggested_fix: >
      Atualizar modal de edição após Story 7.6 (Monaco Tab) completar.
      TD-8.3-001.
  - id: CONCERN-2
    severity: low
    title: 'parseXmlToJson sem biblioteca dedicada'
    description: >
      Parsing XML implementado manualmente. Para XMLs complexos com namespaces
      ou atributos, pode haver edge cases não cobertos.
    suggested_fix: >
      Considerar fast-xml-parser ou xml2js para parsing robusto. TD-8.3-002.
