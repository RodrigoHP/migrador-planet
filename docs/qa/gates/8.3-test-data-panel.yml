status_reason: >
  Implementação completa do painel de dados de teste. testDataStore com
  validateDatasetAgainstXsd(), parseXmlToJson(), limite MAX_DATASETS=5,
  applyDatasetToCanvas() via postMessage. Molecules DatasetItem (badge ✓/⚠/✕,
  indicador ●, botão 🗑️) e DatasetList (upload, mensagem de limite). Organism
  TestDataPanel com layout 30/70, detalhes (campos/loops/tamanho/status),
  "Aplicar no Canvas" e modal de edição Monaco-compatível. EditorLayout
  atualizado com abas "Dados de Teste" + "Console". 26 testes do store.
  482/482 testes passando. Build limpo.
