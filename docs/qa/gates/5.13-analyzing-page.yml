top_issues:
  - id: FAIL-1
    severity: critical
    description: >
      Mismatch de tipo de evento SSE: backend (_event_generator) emite data: {...} sem
      campo event:, disparando evento 'message' no EventSource. Frontend escuta
      addEventListener('step', ...) que nunca é chamado. Progresso permanece 0%,
      blocos nunca atualizam, auto-navegação nunca ocorre.
    file: 'backend/routers/analyze.py, frontend/src/pages/AnalyzingPage.vue'
    fix: >
      Opção A (preferida — backend): alterar _event_generator para yield
      ServerSentEvent(data=json.dumps(event), event="step") e adicionar
      ServerSentEvent(data="", event="done") no sentinel.
      Opção B (frontend): mudar addEventListener('step',...) para 'message' e
      tratar evento done via campo status no JSON.
  - id: CONCERN-1
    severity: minor
    description: >
      handleRetry() chama fetch('/api/analyze', {method: 'POST'}) sem body.
      O endpoint requer {job_id: string}. A chamada falha com HTTP 422.
    file: 'frontend/src/pages/AnalyzingPage.vue linha 391'
    fix: 'Incluir body: JSON.stringify({job_id: session.jobId}) e Content-Type: application/json no fetch.'
  - id: CONCERN-2
    severity: minor
    description: '14 testes não cobrem fluxo SSE: recebimento de step event, atualização de status, auto-navegação done, reconexão backoff.'
    file: 'frontend/src/pages/AnalyzingPage.spec.ts'
  - id: CONCERN-3
    severity: minor
    description: 'Stale comment em analyze.py linha 71: "27-stage pipeline" deve ser 28 estágios.'
    file: 'backend/routers/analyze.py'
recommendations:
  immediate:
    - 'FAIL-1: Corrigir tipo de evento SSE (backend ou frontend) — bloqueante para merge'
    - 'CONCERN-1: Corrigir handleRetry para incluir job_id no body do POST'
  future:
    - 'Adicionar testes de comportamento SSE usando MockEventSource já disponível no spec'
    - 'Corrigir stale comment "27-stage" em analyze.py'
