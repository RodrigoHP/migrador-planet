sdc_flow_per_story:
  - step: po_validate
    agent: po
    command: "*validate-story-draft {id}"
    gate: "score >= 7"
  - step: dev_implement
    agent: dev
    command: "*develop {id}"
  - step: qa_gate
    agent: qa
    command: "*qa-gate {id}"
    gate: "PASS or WAIVED"
  - step: devops_push
    agent: devops
    command: "*push"

orchestration_instructions: |
  Após /compact, aios-master deve:
  1. Criar branch feature/epic-12-renderizacao-visual-editor do main
  2. Para cada story em stories_queue (em ordem de priority):
     a. Chamar @po *validate-story-draft {id}
     b. Se GO: chamar @dev *develop {id}
     c. Chamar @qa *qa-gate {id}
     d. Se PASS: chamar @devops *push (a cada 2-3 stories)
  3. Ao final: PR final para main
