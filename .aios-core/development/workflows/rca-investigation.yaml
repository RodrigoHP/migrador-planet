workflow:
  id: rca-investigation
  name: "RCA Investigation v8.1 — Multi-Model Pipeline"
  version: "8.1"
  description: >-
    Workflow de investigacao profunda de bugs com multi-model pipeline.
    v8.1: Cada fase roda como subagent isolado com modelo otimizado.
    Orquestrador (Opus) coordena pipeline, spawna subagents por fase,
    coleta resultados estruturados via phase contracts, e consolida relatorio.
    Fase 6.5 delega fix para SDC em vez de implementar inline.
    Fallback: se subagent falha, retry 1x com feedback, depois inline (v7.0 behavior).
    Presets: economy (~$1.03), balanced (~$1.40), quality (~$2.50), single (v7.0), adaptive (default).
    Adaptive auto-seleciona preset baseado no dominio Cynefin.
    Fases 2 e 3 rodam em paralelo (~30-40% mais rapido).
    Retry 1x com feedback antes de fallback inline.

    Inclui tudo do v7.0: Pattern Matcher step-by-step, dedup scoring,
    SOP outcome tracking, schema validation, tag validation, evidence gate,
    barrier criticality, escalation assessment, domain branching, backlog materialization.
  type: specialized
  project_types:
    - brownfield
    - feature-development

  metadata:
    elicit: false
    confirmation_required: false
    run_in_background: true

  execution_modes:
    - mode: yolo
      description: "Execucao continua multi-agente — zero confirmacoes"
      prompts: 0
      default: true
      execution_directive: >-
        O orquestrador (@aios-master) spawna cada agente sequencialmente.
        Cada transicao gera um handoff artifact em .aios/handoffs/.
        NAO pedir confirmacao entre fases. NAO esperar input do usuario.
        So interromper em caso de erro bloqueante ou QA gate REJECT.
        Decisoes logadas no relatorio, nao perguntadas ao usuario.
        Fast tracks por dominio Cynefin pulam fases conforme classificacao.
    - mode: interactive
      description: "Perguntas ao usuario em pontos de duvida"
      prompts: 5-10
    - mode: preflight
      description: "Todas as perguntas antes de iniciar investigacao"
      prompts: "10-15"

  # Methodology source of truth: .claude/commands/investigate.md (v8.1)
  # This workflow defines the OPERATIONAL sequence, not the methodology itself.

  # ============================================================
  # MODEL ROUTING — Configurable per-phase model assignment
  # ============================================================
  model_routing:
    default_orchestrator: opus
    phases:
      fase_0:  { model: sonnet, reason: "scoring estruturado, dedup needs reasoning" }
      fase_1:  { model: haiku,  reason: "leitura mecanica, zero raciocinio" }
      fase_2:  { model: sonnet, reason: "pattern matching com formula definida" }
      fase_3:  { model: sonnet, reason: "analise causal, raciocinio medio" }
      fase_4:  { model: opus,   reason: "raciocinio profundo, contrafactual" }
      fase_5:  { model: sonnet, reason: "analise estruturada por checklist" }
      fase_6:  { model: opus,   reason: "julgamento critico, classificar E1-E4" }
      fase_6_5: { model: null,  reason: "SDC bridge — orquestrador direto" }
      fase_8a: { model: opus,   reason: "sintese narrativa — deliverable principal" }
      fase_8b: { model: sonnet, reason: "knowledge artifacts estruturados" }
      fase_9:  { model: sonnet, reason: "trends e data processing" }

    presets:
      economy:
        # Maximo economia (~$1.03), aceita risco em fases analiticas
        fase_0: haiku
        fase_1: haiku
        fase_2: haiku
        fase_3: haiku
        fase_4: sonnet
        fase_5: haiku
        fase_6: sonnet
        fase_8a: sonnet
        fase_8b: haiku
        fase_9: haiku

      balanced:
        # Default (~$1.40) — balance custo/qualidade
        # Usa config de phases acima

      quality:
        # Tudo no modelo mais capaz (~$2.50)
        fase_0: opus
        fase_1: sonnet
        fase_2: opus
        fase_3: opus
        fase_4: opus
        fase_5: opus
        fase_6: opus
        fase_8a: opus
        fase_8b: sonnet
        fase_9: opus

      single:
        # Modo legado — tudo inline sem subagents (v7.0 behavior)
        # Zero overhead de orquestracao. Backward compatible.
        all: inherit

      adaptive:
        # DEFAULT — auto-seleciona preset baseado no dominio Cynefin (pos Fase 0)
        # Fase 0 sempre roda com sonnet (fixo). Depois:
        #   Clear → economy, Complicated → balanced, Complex → quality, Chaotic → quality
        # Override manual: --preset {explicito} tem precedencia.
        fase_0: sonnet  # fixo — precisa rodar ANTES de resolver preset
        resolve_after: fase_0
        mapping:
          clear: economy
          complicated: balanced
          complex: quality
          chaotic: quality

  # ============================================================
  # PHASE CONTRACTS — Formal input/output per phase
  # ============================================================
  phase_contracts:
    fase_0:
      input:
        - { field: bug_report, type: string, required: true, source: user }
        - { field: screenshots, type: "list[path]", required: false, source: user }
        - { field: investigations_yaml, type: string, required: true, source: file }
      output:
        - { field: domain, type: enum, values: [clear, complicated, complex, chaotic] }
        - { field: severity, type: enum, values: [critical, high, medium, low] }
        - { field: scope, type: "list[string]" }
        - { field: dedup_status, type: enum, values: [new, related, duplicate] }
        - { field: dedup_score, type: number, range: "0-100" }
        - { field: related_rcas, type: "list[string] | null" }
        - { field: strategy, type: string }
        - { field: effectiveness_reviews, type: "list[object] | null" }

    fase_1:
      input:
        - { field: bug_report, type: string, required: true, source: user }
        - { field: classification, type: object, required: true, source: fase_0 }
      output:
        - { field: suspects, type: "list[{file, function, change, confidence}]", max: 5 }
        - { field: timeline, type: "list[{date, event}]" }
        - { field: blast_radius, type: "list[string]" }
        - { field: dependency_changes, type: "list[string]" }
        - { field: raw_evidence, type: "list[{type, content}]" }

    fase_2:
      input:
        - { field: suspects, type: list, required: true, source: fase_1 }
        - { field: bug_report, type: string, required: true, source: user }
        - { field: investigations_yaml, type: string, required: true, source: file }
        - { field: known_anti_patterns, type: string, required: true, source: file }
        - { field: sops_dir, type: "list[string]", required: false, source: file }
      output:
        - { field: matches, type: "list[{rca_id, score, classification}]" }
        - { field: confidence_score, type: number, range: "0-100" }
        - { field: fast_track, type: "{accepted: bool, sop_id: string | null}" }
        - { field: anti_pattern_matches, type: "list[{ap_id, score}]" }

    fase_3:
      input:
        - { field: suspects, type: list, required: true, source: fase_1 }
        - { field: matches, type: list, required: false, source: fase_2 }
        - { field: raw_evidence, type: list, required: true, source: fase_1 }
        - { field: bug_report, type: string, required: true, source: user }
      output:
        - { field: causal_graph, type: string, format: markdown }
        - { field: root_causes, type: "list[{description, type, confidence, evidence}]" }
        - { field: contributing_factors, type: "list[string]" }

    fase_4:
      input:
        - { field: root_causes, type: list, required: true, source: fase_3 }
        - { field: raw_evidence, type: list, required: true, source: fase_1 }
        - { field: affected_files, type: "list[string]", required: true, source: fase_1 }
      output:
        - { field: challenge_results, type: "list[{hypothesis, verdict, counter_evidence, confidence}]" }
        - { field: final_ranking, type: "list[{hypothesis, confidence}]" }
        - { field: design_concerns, type: "list[string] | null" }

    fase_5:
      input:
        - { field: root_causes, type: list, required: true, source: "fase_3 (pos-challenge)" }
        - { field: affected_files, type: "list[string]", required: true, source: fase_1 }
      output:
        - { field: barriers, type: "list[{layer, barrier, status, criticality, contrafactual, nature}]" }
        - { field: fix_this_first, type: "list[{barrier, action, priority}]" }
        - { field: escalation_assessment, type: "{criteria_met: number, details: list}" }
        - { field: test_gaps, type: "list[{test, classification, cause, recommendation}]" }

    fase_6:
      input:
        - { field: root_causes, type: list, required: true, source: "fase_3 (pos-challenge)" }
        - { field: raw_evidence, type: list, required: true, source: fase_1 }
        - { field: barriers, type: list, required: true, source: fase_5 }
      output:
        - { field: evidence_summary, type: "list[{claim, level, confidence, sources}]" }
        - { field: e1_confirmed, type: bool }
        - { field: fix_requirements, type: object }

    # fase_7: SDC Bridge — no subagent, generates story and triggers SDC

    fase_8a:
      input:
        - { field: all_previous_outputs, type: object, required: true, source: "fase_0 to fase_6 + sdc_result" }
        - { field: bug_report, type: string, required: true, source: user }
      output:
        - { field: report, type: string, format: markdown }
        - { field: investigation_record, type: object }
        - { field: collateral_findings, type: "list[object] | null" }

    fase_8b:
      input:
        - { field: investigation_record, type: object, required: true, source: fase_8a }
        - { field: collateral_findings, type: "list[object] | null", required: false, source: fase_8a }
        - { field: known_anti_patterns, type: string, required: true, source: file }
        - { field: sops_dir, type: "list[string]", required: false, source: file }
        - { field: tag_taxonomy, type: string, required: false, source: file }
      output:
        - { field: anti_patterns, type: "list[object] | null" }
        - { field: sops, type: "list[object] | null" }
        - { field: handoff, type: "object | null" }
        - { field: backlog_stories, type: "list[object] | null" }

    fase_9:
      input:
        - { field: investigation_record, type: object, required: true, source: fase_8a }
        - { field: investigations_yaml, type: string, required: true, source: file }
        - { field: sops_dir, type: "list[string]", required: false, source: file }
      output:
        - { field: effectiveness_updates, type: "list[object]" }
        - { field: sop_updates, type: "list[object]" }
        - { field: trend_analysis, type: "string | null" }
        - { field: tag_promotions, type: "list[string] | null" }

  phases:
    - phase_0: "Classificacao (Cynefin) — subagent"
    - phase_0_5: "Stabilization (Chaotic only) — subagent"
    - phase_1: "Coleta de Dados (Archaeology) — subagent"
    - phase_2: "Pattern Matching — subagent"
    - phase_3: "Analise Causal (Grafo AND/OR) — subagent"
    - phase_4: "Desafio de Hipoteses — subagent"
    - phase_5: "Analise de Barreiras (Swiss Cheese + Escalation) — subagent"
    - phase_6: "Classificacao de Evidencia — subagent"
    - phase_6_5: "SDC Bridge (Fix + Testes) — orquestrador direto"
    - phase_8a: "Relatorio + Investigation Record — subagent"
    - phase_8b: "Anti-patterns + SOPs + Handoff + Backlog — subagent"
    - phase_9: "Meta-Learning & Entrega — subagent"

  # Fast Track Routing by Cynefin Domain
  fast_tracks:
    clear:
      phases: [0, 1, 6.5, 8a, 8b, 9]
      skip: [2, 3, 4, 5, 6]
      description: "Bug trivial: classify → gather → fix(lite) → document → learn"
      note: "SDC Bridge recebe suspects da Fase 1 (sem Fase 6 fix_requirements)"
    complicated:
      phases: [0, 1, "2∥3", 5, 6, 6.5, 8a, 8b, 9]
      skip: [4]
      parallel: [[2, 3]]
      description: "Bug analisavel: full pipeline sem hypothesis challenge"
    complex:
      phases: [0, 1, "2∥3", 4, 5, 6, 6.5, 8a, 8b, 9]
      skip: []
      parallel: [[2, 3]]
      description: "Bug emergente: full pipeline todas as fases"
    chaotic:
      phases: [0, 0.5, 1, "2∥3", 4, 5, 6, 6.5, 8a, 8b, 9]
      skip: []
      parallel: [[2, 3]]
      description: "Stabilize (0.5) primeiro, depois full pipeline"

  # ============================================================
  # SEQUENCE v8.1 — Multi-Model Pipeline Architecture
  # ============================================================
  # Cada fase roda como subagent isolado (exceto 6.5 e single preset).
  # O orquestrador (Opus) coordena, monta briefings, valida outputs,
  # e executa TODAS as escritas em disco.
  # Metodologia completa: .claude/commands/investigate.md
  # ============================================================
  sequence:

    # ----------------------------------------------------------
    # STEP 1: RECEBER BUG REPORT + DETERMINAR PRESET
    # ----------------------------------------------------------
    - step: init
      id: init
      phase: setup
      agent: orchestrator
      yolo_behavior: auto_proceed
      action: "Coletar bug report e determinar preset de execucao"
      notes: |
        1. Coletar: descricao, error message, screenshots, stack trace → bug_report
        2. Verificar argumento --preset {economy|balanced|quality|single|adaptive}
        3. Default: adaptive (resolve preset pos Fase 0 baseado no dominio)
        4. SE preset = single: executar tudo inline (v7.0 behavior), pular orquestracao
        5. SE preset != single: continuar pipeline multi-model
        6. Carregar knowledge base:
           - investigations.yaml, known-anti-patterns.md, tag-taxonomy.yaml, sops/
        7. Policy global: cada subagent tem retry=1 antes de fallback inline
      outputs:
        - bug_report
        - preset
        - knowledge_base
      next: fase_0

    # ----------------------------------------------------------
    # FASE 0 — CLASSIFICACAO (Classifier Agent)
    # Subagent: model_routing.fase_0 (default: sonnet)
    # ----------------------------------------------------------
    - step: fase_0
      id: fase_0
      phase: 0
      agent: subagent
      model: "{{model_routing.fase_0}}"
      yolo_behavior: auto_proceed
      action: "Classificar problema (Cynefin + dedup + effectiveness review)"
      retry: 1  # retry 1x com feedback antes de fallback
      notes: |
        1. Montar briefing Fase 0 com: bug_report, screenshots, investigations_yaml
        2. Spawnar: Agent(model: routing[fase_0], prompt: briefing_fase_0)
        3. Validar output contra phase_contracts.fase_0
        4. SE validacao falha: RETRY 1x com feedback dos campos faltando
        5. SE retry falha: FALLBACK inline
        6. SE preset=adaptive: resolver preset baseado no domain retornado
        7. Resultado determina fast track (quais fases executar)
        8. SE dedup_status = duplicate (>90%): PARAR pipeline
        9. Orquestrador salva effectiveness_reviews em investigations.yaml
      outputs:
        - domain
        - severity
        - scope
        - dedup_status
        - dedup_score
        - related_rcas
        - strategy
        - effectiveness_reviews
      next: fase_0_5
      on_duplicate: complete

    # ----------------------------------------------------------
    # FASE 0.5 — STABILIZATION (Chaotic Domain Only)
    # Subagent: model_routing.fase_0 (reusa modelo da Fase 0)
    # ----------------------------------------------------------
    - step: fase_0_5
      id: fase_0_5
      phase: 0.5
      agent: subagent
      model: "{{model_routing.fase_0}}"
      yolo_behavior: auto_proceed
      condition: "domain == 'chaotic'"
      action: "Conter impacto imediato antes de investigar"
      notes: |
        1. Montar briefing Fase 0.5 com: bug_report, classification
        2. Spawnar subagent (reusa modelo da Fase 0)
        3. Validar: containment_method presente, stability_status = stable
        4. SE validacao falha: FALLBACK inline
      outputs:
        - containment_method
        - stability_status
      next: fase_1
      on_skip: fase_1

    # ----------------------------------------------------------
    # FASE 1 — COLETA DE DADOS (Archaeologist Agent)
    # Subagent: model_routing.fase_1 (default: haiku)
    # ----------------------------------------------------------
    - step: fase_1
      id: fase_1
      phase: 1
      agent: subagent
      model: "{{model_routing.fase_1}}"
      yolo_behavior: auto_proceed
      requires: fase_0
      action: "Coleta automatica: git forensics, timeline, change ranking"
      notes: |
        1. Montar briefing Fase 1 com: bug_report, classification (Fase 0)
        2. Spawnar: Agent(model: routing[fase_1], prompt: briefing_fase_1)
        3. Validar output contra phase_contracts.fase_1
        4. SE validacao falha: FALLBACK inline
      outputs:
        - suspects
        - timeline
        - blast_radius
        - dependency_changes
        - raw_evidence
      next: fase_2_3_parallel

    # ----------------------------------------------------------
    # FASES 2 ∥ 3 — PARALLEL EXECUTION
    # Pattern Matching + Causal Analysis rodam em paralelo
    # Ambas dependem apenas da Fase 1 (independentes entre si)
    # ----------------------------------------------------------
    - step: fase_2_3_parallel
      id: fase_2_3_parallel
      phase: "2+3"
      agent: orchestrator
      yolo_behavior: auto_proceed
      requires: fase_1
      condition: "domain != 'clear'"
      action: "Spawnar Fase 2 e Fase 3 em paralelo, merge resultados"
      notes: |
        Orquestrador spawna AMBOS subagents simultaneamente:
        1. Agent(model: routing[fase_2], prompt: briefing_fase_2) — Pattern Matching
        2. Agent(model: routing[fase_3], prompt: briefing_fase_3) — Causal Analysis
        3. Await ambos resultados
        4. Validar cada um contra phase contracts (retry/fallback individual)
        5. SE fast_track.accepted na Fase 2: orquestrador atualiza SOP times_applied
        6. Merge: resultado_fase_2 + resultado_fase_3
        7. NOTA: Fase 3 NAO recebe matches da Fase 2 no modo paralelo
           (recebe apenas suspects + raw_evidence da Fase 1).
           Matches da Fase 2 sao usados a partir da Fase 4/5.
        Beneficio: ~30-40% menos tempo nas fases analiticas.
      outputs:
        - matches           # da Fase 2
        - confidence_score   # da Fase 2
        - fast_track         # da Fase 2
        - anti_pattern_matches  # da Fase 2
        - causal_graph       # da Fase 3
        - root_causes        # da Fase 3
        - contributing_factors  # da Fase 3
      next: fase_4
      on_skip: fase_6_5

    # ----------------------------------------------------------
    # FASE 4 — DESAFIO DE HIPOTESES (Hypothesis Challenger)
    # Subagent: model_routing.fase_4 (default: opus)
    # ----------------------------------------------------------
    - step: fase_4
      id: fase_4
      phase: 4
      agent: subagent
      model: "{{model_routing.fase_4}}"
      yolo_behavior: auto_proceed
      requires: fase_2_3_parallel
      condition: "domain in ['complex', 'chaotic']"
      action: "Desafiar hipoteses com contra-evidencia e counterfactual"
      notes: |
        1. Montar briefing Fase 4 com: root_causes (Fase 3),
           raw_evidence (Fase 1), affected_files (Fase 1)
        2. Spawnar: Agent(model: routing[fase_4], prompt: briefing_fase_4)
        3. Validar output contra phase_contracts.fase_4
        4. SE validacao falha: FALLBACK inline
      outputs:
        - challenge_results
        - final_ranking
        - design_concerns
      next: fase_5
      on_skip: fase_5

    # ----------------------------------------------------------
    # FASE 5 — ANALISE DE BARREIRAS (Barrier Analyst)
    # Subagent: model_routing.fase_5 (default: sonnet)
    # ----------------------------------------------------------
    - step: fase_5
      id: fase_5
      phase: 5
      agent: subagent
      model: "{{model_routing.fase_5}}"
      yolo_behavior: auto_proceed
      requires: fase_2_3_parallel
      condition: "domain != 'clear'"
      action: "Swiss Cheese Model — 6 camadas + escalation assessment"
      notes: |
        1. Montar briefing Fase 5 com: root_causes (Fase 3 pos-challenge),
           affected_files (Fase 1)
        2. Spawnar: Agent(model: routing[fase_5], prompt: briefing_fase_5)
        3. Validar output contra phase_contracts.fase_5
        4. Escalation assessment (4 criterios) eh OBRIGATORIO
        5. SE validacao falha: FALLBACK inline
      outputs:
        - barriers
        - fix_this_first
        - escalation_assessment
        - test_gaps
      next: fase_6
      on_skip: fase_6_5

    # ----------------------------------------------------------
    # FASE 6 — CLASSIFICACAO DE EVIDENCIA (Evidence Grader)
    # Subagent: model_routing.fase_6 (default: opus)
    # ----------------------------------------------------------
    - step: fase_6
      id: fase_6
      phase: 6
      agent: subagent
      model: "{{model_routing.fase_6}}"
      yolo_behavior: auto_proceed
      requires: fase_5
      condition: "domain != 'clear'"
      action: "Classificar achados E1-E4, evidence gate obrigatorio"
      notes: |
        1. Montar briefing Fase 6 com: root_causes (Fase 3 pos-challenge),
           raw_evidence (Fase 1), barriers (Fase 5)
        2. Spawnar: Agent(model: routing[fase_6], prompt: briefing_fase_6)
        3. Validar output contra phase_contracts.fase_6
        4. Evidence gate: pelo menos 1 E1_confirmed para prosseguir
        5. SE validacao falha: FALLBACK inline
      outputs:
        - evidence_summary
        - e1_confirmed
        - fix_requirements
      next: fase_6_5
      on_skip: fase_6_5

    # ----------------------------------------------------------
    # FASE 6.5 — SDC BRIDGE (Orquestrador Direto)
    # Sem subagent — orquestrador executa diretamente
    # ----------------------------------------------------------
    - step: fase_6_5
      id: fase_6_5
      phase: 6.5
      agent: orchestrator
      yolo_behavior: auto_proceed
      requires: fase_0
      action: "Gerar story de fix e delegar para SDC"
      notes: |
        Orquestrador executa diretamente (sem subagent):

        DUAL PATH (conforme dominio):
        A) Full pipeline (Complicated/Complex/Chaotic):
           - Usar fix_requirements da Fase 6
           - Evidence level da Fase 6

        B) Clear domain (fast track):
           - Usar suspects da Fase 1 (sem Fase 6)
           - evidence_level: E2_correlated (sem confirmacao formal)

        PROCEDIMENTO:
        1. Gerar story draft em docs/stories/backlog/
        2. Disparar SDC: @sm *draft → @dev *develop → @qa *qa-gate
        3. Coletar resultado do SDC (pass/fail + arquivos modificados)
        4. SE SDC fail: documentar no relatorio, continuar pipeline
      outputs:
        - sdc_story_path
        - sdc_result
        - fixed_files
        - test_files
      next: fase_8a

    # ----------------------------------------------------------
    # FASE 8a — RELATORIO (Report Writer Agent)
    # Subagent: model_routing.fase_8a (default: opus)
    # ----------------------------------------------------------
    - step: fase_8a
      id: fase_8a
      phase: 8
      agent: subagent
      model: "{{model_routing.fase_8a}}"
      yolo_behavior: auto_proceed
      requires: fase_6_5
      action: "Gerar relatorio completo + investigation_record (19 campos)"
      notes: |
        1. Montar briefing Fase 8a com: TODOS outputs anteriores (Fase 0-6 + SDC),
           bug_report original
        2. Spawnar: Agent(model: routing[fase_8a], prompt: briefing_fase_8a)
        3. Validar: report nao vazio, investigation_record tem 19 campos
        4. SE validacao falha: FALLBACK inline
        5. Orquestrador salva relatorio em docs/qa/investigations/
      outputs:
        - report
        - investigation_record
        - collateral_findings
      next: fase_8b

    # ----------------------------------------------------------
    # FASE 8b — KNOWLEDGE ARTIFACTS (Knowledge Curator Agent)
    # Subagent: model_routing.fase_8b (default: sonnet)
    # ----------------------------------------------------------
    - step: fase_8b
      id: fase_8b
      phase: 8
      agent: subagent
      model: "{{model_routing.fase_8b}}"
      yolo_behavior: auto_proceed
      requires: fase_8a
      action: "Tag validation + anti-patterns + SOPs + handoff + backlog"
      notes: |
        1. Montar briefing Fase 8b com: investigation_record (Fase 8a),
           collateral_findings (Fase 8a), known_anti_patterns, sops, tag_taxonomy
        2. Spawnar: Agent(model: routing[fase_8b], prompt: briefing_fase_8b)
        3. Validar: tag_validation presente, formatos corretos
        4. SE validacao falha: FALLBACK inline
        5. Orquestrador salva:
           - Anti-patterns em docs/qa/known-anti-patterns.md
           - Handoff em .aios/handoffs/handoff-rca-to-sdc-{date}.yaml
           - Backlog stories em docs/stories/backlog/
      outputs:
        - tag_validation
        - anti_patterns
        - sops
        - handoff
        - backlog_stories
      next: fase_9

    # ----------------------------------------------------------
    # FASE 9 — META-LEARNING (Meta-Learner Agent)
    # Subagent: model_routing.fase_9 (default: sonnet)
    # ----------------------------------------------------------
    - step: fase_9
      id: fase_9
      phase: 9
      agent: subagent
      model: "{{model_routing.fase_9}}"
      yolo_behavior: auto_proceed
      requires: fase_8b
      action: "Registrar na knowledge base, SOP outcomes, trends, alertas"
      notes: |
        1. Montar briefing Fase 9 com: investigation_record (Fase 8a),
           investigations_yaml, sops
        2. Spawnar: Agent(model: routing[fase_9], prompt: briefing_fase_9)
        3. Validar: investigation_registered presente
        4. SE validacao falha: FALLBACK inline
        5. Orquestrador salva:
           - Registro em docs/qa/rca-knowledge/investigations.yaml
           - SOPs em docs/qa/rca-knowledge/sops/
           - SOP outcome updates
           - Tag promotions em tag-taxonomy.yaml
        NOTA: Effectiveness review de investigacoes anteriores ja executado na Fase 0.
        Esta fase foca em registrar investigacao ATUAL + SOP outcomes + trends.
      outputs:
        - investigation_registered
        - sop_updates
        - sop_generated
        - trend_analysis
        - alerts
        - tag_promotions
      next: consolidate

    # ----------------------------------------------------------
    # CONSOLIDACAO — Pipeline Metrics + Entrega
    # Orquestrador direto (sem subagent)
    # ----------------------------------------------------------
    - step: consolidate
      id: consolidate
      phase: delivery
      agent: orchestrator
      yolo_behavior: auto_proceed
      requires: fase_9
      action: "Consolidar pipeline metrics e entregar resultado"
      notes: |
        1. Gerar pipeline_metrics:
           ```yaml
           pipeline_metrics:
             preset: {preset}  # ou adaptive:{resolved_preset}
             phases_via_subagent: [lista]
             phases_via_retry: [lista]
             phases_via_fallback: [lista]
             phases_via_sdc: [6.5]
             phases_parallel: [[2, 3]]
             total_phases: N
             retry_count: N
             fallback_count: N
             estimated_cost: ${valor}
             estimated_cost_if_single: $2.93
           ```
        2. Adicionar metrics ao relatorio
        3. Apresentar resultado ao usuario:
           - Resumo: domain, severity, root cause, fix
           - Link para relatorio completo
           - Pipeline metrics
           - Alertas (se houver)
      outputs:
        - pipeline_metrics
        - final_summary
      next: complete

    - workflow_end:
      id: complete
      action: investigation_complete
      notes: |
        RCA v8.1 pipeline completo.

        Artefatos gerados pelo orquestrador:
        - Relatorio: docs/qa/investigations/rca-{date}-{slug}.md
        - Investigation record: docs/qa/rca-knowledge/investigations.yaml
        - Anti-patterns: docs/qa/known-anti-patterns.md
        - SOPs: docs/qa/rca-knowledge/sops/
        - Handoff: .aios/handoffs/handoff-rca-to-sdc-{date}.yaml
        - Backlog stories: docs/stories/backlog/
        - Pipeline metrics no relatorio

  flow_diagram: |
    ```mermaid
    graph TD
        Z[Bug Reportado] --> INIT["Init: Coletar + Preset"]
        INIT --> F0["Fase 0: Classifier (sonnet)"]
        F0 -->|DUPLICATA >90%| END[Parar]
        F0 -->|Clear| F1
        F0 -->|Chaotic| F05["Fase 0.5: Stabilization"]
        F0 -->|Complicated/Complex| F1
        F05 --> F1

        F1["Fase 1: Archaeologist (haiku)"] --> PAR{"Paralelo"}
        PAR --> F2["Fase 2: Pattern Matcher (sonnet)"]
        PAR --> F3["Fase 3: Causal Reasoner (sonnet)"]
        F2 --> MERGE["Merge 2+3"]
        F3 --> MERGE
        MERGE --> HC{Complex/Chaotic?}
        HC -->|Sim| F4["Fase 4: Hypothesis Challenger (opus)"]
        HC -->|Nao| F5
        F4 --> F5["Fase 5: Barrier Analyst (sonnet)"]
        F5 --> F6["Fase 6: Evidence Grader (opus)"]

        F1 -->|Clear fast track| SDC
        F6 --> SDC["Fase 6.5: SDC Bridge (orquestrador)"]
        SDC --> F8A["Fase 8a: Report Writer (opus)"]
        F8A --> F8B["Fase 8b: Knowledge Curator (sonnet)"]
        F8B --> F9["Fase 9: Meta-Learner (sonnet)"]
        F9 --> CON["Consolidar Pipeline Metrics"]
        CON --> OK[Completo]

        style F0 fill:#f3e5f5,stroke:#7b1fa2
        style F1 fill:#e8f5e9,stroke:#2e7d32
        style F3 fill:#e8f5e9,stroke:#2e7d32
        style F4 fill:#fff3e0,stroke:#ef6c00
        style F5 fill:#fce4ec,stroke:#c62828
        style F6 fill:#e3f2fd,stroke:#1565c0
        style SDC fill:#e8f5e9,stroke:#2e7d32
        style F8A fill:#fff3e0,stroke:#ef6c00
        style F9 fill:#f3e5f5,stroke:#7b1fa2
        style CON fill:#e3f2fd,stroke:#1565c0
    ```

  failure_recovery:
    # v8.1: cada falha de subagent → retry 1x → FALLBACK inline (orquestrador executa)
    subagent_fails: "FALLBACK — orquestrador executa fase inline (v7.0 behavior)"
    phase_0_classification_fails: "ABORT — nenhum codigo alterado"
    phase_1_archaeology_fails: "FALLBACK inline — investigacao manual pelo orquestrador"
    phase_2_pattern_fails: "FALLBACK inline — continuar sem knowledge base"
    phase_3_causal_fails: "FALLBACK inline — 5 Whys linear pelo orquestrador"
    phase_4_challenge_fails: "FALLBACK inline — aceitar hipoteses sem challenge"
    phase_5_barrier_fails: "FALLBACK inline — apenas recomendar no relatorio"
    phase_6_evidence_fails: "FALLBACK inline — sem evidence grading formal"
    phase_6_5_sdc_fails: "Documentar no relatorio — continuar pipeline"
    phase_8a_report_fails: "FALLBACK inline — orquestrador gera relatorio"
    phase_8b_knowledge_fails: "FALLBACK inline — orquestrador gera artefatos"
    phase_9_meta_fails: "FALLBACK inline — registrar minimamente"

  escalation_prompts:
    to_architect: |
      Problema ESTRUTURAL identificado na barrier analysis.
      Root cause: {{root_cause_statement}}.
      Barrier analysis: {{barrier_analysis.swiss_cheese_summary}}.
      @architect: avaliar e propor solucao de design.

      Criterios de escalacao (v6.0 — qualquer 1 atingido):
      1. Scope amplo: bug afeta 3+ modulos/stages
      2. Design pattern: root cause eh uso incorreto de design pattern
      3. Interface change: fix requer mudanca de contrato entre componentes
      4. Barrier systemic: falha em 4+ camadas de defesa

    to_sdc: |
      RCA v5.0 completo. {{created_stories.length}} stories de backlog criadas.
      Handoff artifact gerado em .aios/handoffs/.
      Knowledge base atualizada. SOP gerado.
      Proximo passo: @po *validate-story-draft.

  decision_guidance:
    when_to_use:
      - Bug reportado com stack trace ou evidencia de erro
      - Erro recorrente que precisa de investigacao profunda
      - Problema que pode ser sistemico
      - Qualquer fix que seria apenas um guard/workaround
    when_not_to_use:
      - Typo ou erro de formatacao obvio (mas considere fast track Clear)
      - Feature request sem bug associado
      - Refactoring planejado sem indicio de erro

  engine_requirements:
    note: >-
      Este workflow usa engine v8.1 com multi-model pipeline.
      Cada fase roda como subagent isolado com modelo otimizado.
      Orquestrador Opus coordena, phase contracts validam I/O,
      model routing configuravel via presets.
      Fase 6.5 delega para SDC (quality gate real).
      Retry 1x com feedback antes de fallback inline.
      Inclui tudo do v7.0: fast tracks, SOP outcome tracking,
      dedup scoring, test gap methodology, Swiss Cheese severity,
      tag taxonomy, escalation criteria, handoff RCA→SDC.
    fallback: guided
    target: engine
    action: yolo_continuous

